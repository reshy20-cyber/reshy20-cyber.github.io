# Deploys the shared purchase check (supabase/functions/verify-purchase) to the HAYATI Supabase project.
# Runs by itself when the function changes, or by hand from the Actions tab.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens).
name: Deploy purchase check to Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/functions/verify-purchase/**", ".github/workflows/supabase-functions.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy verify-purchase
        env:
          TOKEN_RAW: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # The apps call it without a signed-in user; the function itself checks every purchase with Google.
        run: |
          # remove spaces / line breaks that can sneak in when pasting the secret on a phone
          SUPABASE_ACCESS_TOKEN="$(printf '%s' "$TOKEN_RAW" | tr -d '[:space:]')"
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            *) echo "::error::SUPABASE_ACCESS_TOKEN does not look like a Supabase access token (it should start with sbp_; length ${#SUPABASE_ACCESS_TOKEN}). Paste the token from supabase.com → Account → Access Tokens."; exit 1 ;;
          esac
          export SUPABASE_ACCESS_TOKEN
          supabase functions deploy verify-purchase --remote=nwlmoecyepsajayyyugd --no-verify-jwt --use-api --yes
