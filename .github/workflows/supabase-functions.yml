# Deploys the shared purchase check (supabase/functions/verify-purchase) to the HAYATI Supabase project.
# Runs by itself when the function changes, or by hand from the Actions tab.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens).
name: Deploy purchase check to Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/functions/verify-purchase/**", ".github/workflows/supabase-functions.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy verify-purchase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # The apps call it without a signed-in user; the function itself checks every purchase with Google.
        run: supabase functions deploy verify-purchase --project-ref nwlmoecyepsajayyyugd --no-verify-jwt --use-api
