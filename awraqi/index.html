<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أوراقي — تذكير بانتهاء أوراق العائلة</title>
<meta name="description" content="أوراقي: سجّل تواريخ انتهاء الجوازات والإقامات والرخص لك ولعائلتك، ونبّهك قبل الانتهاء مع قائمة المستندات المطلوبة للتجديد.">
<meta name="theme-color" content="#eef1f5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--paper:#eef1f5;--ink:#0e2a47;--ink2:#46607c;--line:#d5dde7;--card:#fff;--ok:#1e8a5c;--okbg:#e3f3ec;--soon:#e8a317;--soonbg:#fdf1d6;--bad:#c8362b;--badbg:#fbe4e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Readex Pro",-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 12px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand{font-size:26px;font-weight:700;letter-spacing:-.2px}
.tagline{font-size:13.5px;color:var(--ink2);font-weight:400}
.tabs{display:flex;gap:20px;overflow-x:auto;margin:16px 0 4px;border-bottom:1px solid var(--line)}
.tab{flex:0 0 auto;background:none;border:none;border-bottom:3px solid transparent;color:var(--ink2);font-size:16px;font-weight:500;padding:8px 0 9px;cursor:pointer;margin-bottom:-1px}
.tab.active{color:var(--ink);font-weight:700;border-bottom-color:var(--soon)}
.tab.add{color:var(--ink2);font-weight:400}
/* الختم */
.hero{display:flex;align-items:center;gap:18px;margin:22px 0 26px}
.stamp{position:relative;flex:0 0 138px;height:138px;display:grid;place-items:center;transform:rotate(-7deg);color:var(--bad)}
.stamp.soon{color:#b97d00}.stamp.ok{color:var(--ok)}
.stamp svg{position:absolute;inset:0;width:100%;height:100%}
.stamp .num{font-size:46px;font-weight:700;line-height:1;text-align:center}
.stamp .unit{display:block;font-size:13px;font-weight:600;margin-top:2px}
.hero-text h2{margin:0 0 4px;font-size:20px;font-weight:700;line-height:1.4}
.hero-text p{margin:0 0 12px;color:var(--ink2);font-size:14px;line-height:1.7}
.stamp.empty{color:var(--ink2);opacity:.7}
/* التذاكر */
.pass{position:relative;display:flex;background:var(--card);border-radius:12px;margin-bottom:12px;box-shadow:0 1px 0 rgba(14,42,71,.06),0 6px 14px -8px rgba(14,42,71,.28)}
.pass-main{flex:1;min-width:0;padding:14px 16px}
.pass-title{font-size:17px;font-weight:600;line-height:1.5}
.pass-sub{font-size:13px;color:var(--ink2);margin-top:1px}
.pass-actions{display:flex;gap:8px;margin-top:11px}
.pass-stub{flex:0 0 96px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-inline-start:2px dashed var(--line);border-radius:12px 0 0 12px;padding:8px;text-align:center}
.pass-stub b{font-size:28px;font-weight:700;line-height:1.1}
.pass-stub span{font-size:12.5px;font-weight:500}
.pass::before,.pass::after{content:"";position:absolute;left:87px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.pass::before{top:-9px}.pass::after{bottom:-9px}
.pass.ok .pass-stub{color:var(--ok);background:var(--okbg)}
.pass.soon .pass-stub{color:#9a6700;background:var(--soonbg)}
.pass.bad .pass-stub{color:var(--bad);background:var(--badbg)}
.btn{white-space:nowrap;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;min-height:38px;padding:0 11px;font-size:13px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--ink);color:#fff}
.btn.quiet{border-color:var(--line);color:var(--ink2)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.empty-list{color:var(--ink2);font-size:14.5px;line-height:1.9;margin:4px 0 0}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;right:16px;max-width:528px;margin:0 auto;min-height:54px;border:none;border-radius:14px;background:var(--ink);color:#fff;font-size:17px;font-weight:600;box-shadow:0 10px 24px -8px rgba(14,42,71,.55);cursor:pointer}
.fab:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--soon);outline-offset:2px}
.modal{position:fixed;inset:0;background:rgba(14,42,71,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px;max-height:88vh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:19px}
label{display:block;font-size:13.5px;font-weight:600;margin:12px 0 5px}
input,select{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;margin-top:16px}.row .btn{flex:1;min-height:48px}
ul.check{padding:0 22px 0 0;line-height:2.1;margin:8px 0}
.note{font-size:12.5px;color:var(--ink2);line-height:1.9;margin-top:10px}
.upsell{border:2px dashed var(--soon);border-radius:12px;padding:16px;margin:6px 0 12px;text-align:center;line-height:1.9;background:var(--soonbg)}
a{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--soon);text-underline-offset:4px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;display:none;max-width:90%}
@media (prefers-reduced-motion:no-preference){.stamp{animation:thud .5s cubic-bezier(.2,.9,.3,1.2) both}@keyframes thud{from{transform:rotate(-14deg) scale(1.35);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}}
</style>
</head>
<body>
<main>
  <div class="top"><div class="brand">أوراقي</div><div class="tagline" id="tagline"></div></div>
  <nav class="tabs" id="members" aria-label="أفراد العائلة"></nav>
  <section class="hero" id="hero"></section>
  <div id="list"></div>
  <div id="upsell"></div>
  <p class="note">يحفظ التطبيق اسم الورقة وتاريخ انتهائها فقط، على جهازك. لا صور ولا أرقام مستندات ولا حسابات.</p>
</main>
<button class="fab" onclick="openDoc()">إضافة ورقة</button>

<div class="modal" id="docModal" onclick="if(event.target===this)closeM('docModal')"><div class="sheet">
  <h2 id="docTitle">إضافة ورقة</h2>
  <label>لمن هذه الورقة؟</label><select id="fMember"></select>
  <label>نوع الورقة</label><select id="fType"></select>
  <label>الدولة التي أصدرت الورقة</label><select id="fCountry"></select>
  <label>اسم مخصّص (اختياري)</label><input id="fName" maxlength="40" placeholder="مثال: جواز سفر أحمد">
  <label>تاريخ الانتهاء</label><input type="date" id="fDate">
  <div class="row"><button class="btn primary" onclick="saveDoc()">حفظ</button><button class="btn quiet" onclick="closeM('docModal')">إلغاء</button></div>
  <div class="row" id="delRow" style="display:none"><button class="btn danger" onclick="delCurrent()">حذف هذه الورقة</button></div>
</div></div>

<div class="modal" id="infoModal" onclick="if(event.target===this)closeM('infoModal')"><div class="sheet">
  <h2 id="infoTitle"></h2><div id="infoBody"></div>
  <div class="row"><button class="btn" onclick="closeM('infoModal')">إغلاق</button></div>
</div></div>

<div class="modal" id="memModal" onclick="if(event.target===this)closeM('memModal')"><div class="sheet">
  <h2>إضافة فرد من العائلة</h2>
  <label>الاسم</label><input id="mName" maxlength="24" placeholder="مثال: زوجتي، أحمد">
  <div class="row"><button class="btn primary" onclick="saveMember()">إضافة</button><button class="btn" onclick="closeM('memModal')">إلغاء</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script src="renewals.js"></script>
<script>
(function(){
'use strict';
const KEY='awraqi_v1', FREE_DOCS=3;
const TYPES={
  passport:{ar:'جواز سفر',ic:'🛂',list:['الجواز القديم','صور شخصية بمواصفات الجهة المصدِرة','الهوية الوطنية أو الإقامة السارية','إيصال الرسوم','حجز موعد أو تقديم الطلب عبر الموقع الرسمي أو القنصلية']},
  residence:{ar:'إقامة',ic:'🏠',list:['جواز سفر ساري المفعول (غالبًا لا يقل عن 6 أشهر)','الإقامة الحالية','عقد العمل أو إثبات سكن/دراسة حسب نوع الإقامة','تأمين صحي إن كان مطلوبًا','صور شخصية','إيصال الرسوم']},
  visa:{ar:'تأشيرة',ic:'✈️',list:['جواز ساري المفعول','حجز سفر وإقامة','إثبات تمويل أو كشف حساب','تأمين سفر إن كان مطلوبًا','طلب التأشيرة وصور شخصية','إيصال الرسوم']},
  license:{ar:'رخصة قيادة',ic:'🚗',list:['الرخصة الحالية','الهوية أو الإقامة','صور شخصية','فحص طبي/نظر إن كان مطلوبًا','إيصال الرسوم']},
  id:{ar:'بطاقة هوية',ic:'🪪',list:['البطاقة القديمة','صور شخصية','مستند إثبات العنوان إن كان مطلوبًا','إيصال الرسوم']},
  insurance:{ar:'تأمين (سيارة/صحي)',ic:'🛡️',list:['وثيقة التأمين الحالية','بيانات المركبة أو المؤمَّن عليه','مقارنة عروض قبل التجديد','سداد القسط']},
  card:{ar:'بطاقة بنكية',ic:'💳',list:['اتصل بالبنك أو افتح تطبيقه قبل الانتهاء','تأكد من العنوان لاستلام البطاقة الجديدة','حدّث البطاقة في الخدمات المرتبطة بها']},
  other:{ar:'ورقة أخرى',ic:'📎',list:['راجع الجهة المصدِرة لمعرفة المستندات المطلوبة','جهّز نسخة من الورقة الحالية','احجز موعدًا إن كان مطلوبًا']}
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.members)&&Array.isArray(d.docs))return d}catch(e){}return{members:[{id:'m1',name:'أنا'}],docs:[],premium:false}}
let S=load(), cur='all';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function daysLeft(iso){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function status(n){return n<=30?'bad':n<=90?'soon':'ok'}
function big(n){if(n<0)return[String(-n),'يوم مضى'];if(n===0)return['0','تنتهي اليوم'];if(n<=99)return[String(n),'يوم'];if(n<730)return[String(Math.round(n/30)),'شهر'];return[(n/365).toFixed(1),'سنة']}
function label(n){if(n<0)return'منتهية منذ '+(-n)+' يوم';if(n===0)return'تنتهي اليوم';if(n<=60)return'باقي '+n+' يوم';const mo=Math.round(n/30);return mo<24?'باقي '+mo+' شهر':'باقي '+(n/365).toFixed(1)+' سنة'}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
window.closeM=id=>$(id).classList.remove('open');
const openM=id=>$(id).classList.add('open');

function render(){
  $('members').innerHTML='<button class="tab '+(cur==='all'?'active':'')+'" onclick="pick(\'all\')">الكل</button>'
    +S.members.map(m=>'<button class="tab '+(cur===m.id?'active':'')+'" onclick="pick(\''+m.id+'\')">'+esc(m.name)+'</button>').join('')
    +'<button class="tab add" onclick="openMember()">+ فرد</button>';
  const docs=S.docs.filter(d=>cur==='all'||d.member===cur).map(d=>({d,n:daysLeft(d.date)})).filter(x=>x.n!==null).sort((a,b)=>a.n-b.n);
  const urgent=docs.filter(x=>status(x.n)!=='ok').length;
  $('tagline').textContent=docs.length?(urgent?urgent+(urgent===1?' ورقة تحتاج انتباهك':' أوراق تحتاج انتباهك'):'كل أوراقك سارية'):'';
  // الختم: أقرب ورقة انتهاءً
  const h=docs[0];
  if(h){
    const t=TYPES[h.d.type]||TYPES.other,st=status(h.n),m=S.members.find(x=>x.id===h.d.member),bg=big(h.n);
    $('hero').innerHTML='<div class="stamp '+st+'"><svg viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="66" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="70" cy="70" r="58" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 5"/></svg><div><div class="num">'+bg[0]+'</div><span class="unit">'+bg[1]+'</span></div></div>'
      +'<div class="hero-text"><h2>'+esc(h.d.name||t.ar)+'</h2><p>'+(m?esc(m.name)+' — ':'')+'تنتهي '+esc(h.d.date)+'</p><button class="btn primary" onclick="info(\''+h.d.id+'\')">كيف أجدّدها؟</button></div>';
  }else{
    $('hero').innerHTML='<div class="stamp empty"><svg viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="66" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="70" cy="70" r="58" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 5"/></svg><div class="num" style="font-size:40px">؟</div></div><div class="hero-text"><h2>لا أوراق بعد</h2><p>أضف جواز سفرك أو إقامتك، وسنخبرك قبل أن تنتهي.</p></div>';
  }
  const rest=docs.slice(h?1:0);
  $('list').innerHTML=rest.map(({d,n})=>{
    const t=TYPES[d.type]||TYPES.other,st=status(n),m=S.members.find(x=>x.id===d.member),bg=big(n);
    return '<div class="pass '+st+'"><div class="pass-main"><div class="pass-title">'+t.ic+' '+esc(d.name||t.ar)+'</div><div class="pass-sub">'+esc(m?m.name:'')+' — '+esc(d.date)+(d.country&&d.country!=='other'?' — '+esc(window.COUNTRIES[d.country]):'')+'</div>'
     +'<div class="pass-actions"><button class="btn quiet" onclick="info(\''+d.id+'\')">كيف أجدّدها؟</button><button class="btn quiet" onclick="ics(\''+d.id+'\')">تذكير</button><button class="btn quiet" onclick="openDoc(\''+d.id+'\')">تعديل</button></div></div>'
     +'<div class="pass-stub"><b>'+bg[0]+'</b><span>'+bg[1]+'</span></div></div>';
  }).join('');
  if(h){ // أزرار الختم الإضافية
    $('hero').querySelector('.hero-text').insertAdjacentHTML('beforeend','<div style="margin-top:8px;display:flex;gap:8px"><button class="btn quiet" onclick="ics(\''+h.d.id+'\')">تذكير</button><button class="btn quiet" onclick="openDoc(\''+h.d.id+'\')">تعديل</button></div>');
  }
  const locked=!S.premium&&S.docs.length>=FREE_DOCS;
  $('upsell').innerHTML=locked?'<div class="upsell">وصلت إلى حد النسخة المجانية ('+FREE_DOCS+' أوراق).<br><button class="btn primary" id="upBtn" onclick="upgrade()">فتح أوراق غير محدودة</button></div>':'';
  if(locked&&window.__awPrice)$('upBtn').textContent='فتح أوراق غير محدودة — '+window.__awPrice;
}
window.pick=id=>{cur=id;render()};

window.openDoc=function(id){
  const d=id?S.docs.find(x=>x.id===id):null;
  if(!d&&!S.premium&&S.docs.length>=FREE_DOCS){toast('وصلت إلى حد النسخة المجانية');upgrade();return}
  $('docTitle').textContent=d?'تعديل الورقة':'إضافة ورقة';
  $('fMember').innerHTML=S.members.map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('');
  $('fType').innerHTML=Object.keys(TYPES).map(k=>'<option value="'+k+'">'+TYPES[k].ic+' '+TYPES[k].ar+'</option>').join('');
  $('fCountry').innerHTML=Object.keys(window.COUNTRIES).map(k=>'<option value="'+k+'">'+window.COUNTRIES[k]+'</option>').join('');
  $('fCountry').value=d?(d.country||'other'):(S.lastCountry||'other');
  $('fMember').value=d?d.member:(cur!=='all'?cur:S.members[0].id);
  $('fType').value=d?d.type:'passport';$('fName').value=d?(d.name||''):'';$('fDate').value=d?d.date:'';
  openDoc.editing=id||null;$('delRow').style.display=id?'flex':'none';openM('docModal');
};
window.saveDoc=function(){
  const date=$('fDate').value;if(daysLeft(date)===null){toast('اختر تاريخ الانتهاء');return}
  const rec={member:$('fMember').value,type:$('fType').value,country:$('fCountry').value,name:$('fName').value.trim().slice(0,40),date};
  if(openDoc.editing){Object.assign(S.docs.find(x=>x.id===openDoc.editing),rec)}else{S.docs.push(Object.assign({id:uid()},rec))}
  S.lastCountry=$('fCountry').value;save();closeM('docModal');render();toast('تم الحفظ');
};
window.delCurrent=function(){const id=openDoc.editing;if(id&&confirm('حذف هذه الورقة؟')){S.docs=S.docs.filter(x=>x.id!==id);save();closeM('docModal');render()}};
window.openMember=function(){$('mName').value='';openM('memModal')};
window.saveMember=function(){const n=$('mName').value.trim();if(!n){toast('اكتب الاسم');return}S.members.push({id:uid(),name:n.slice(0,24)});save();closeM('memModal');render()};
window.info=function(id){
  const d=S.docs.find(x=>x.id===id);if(!d)return;const t=TYPES[d.type]||TYPES.other;
  const cn=window.COUNTRIES[d.country||'other'];
  const e=(window.RENEWALS[d.country]||{})[d.type];
  $('infoTitle').textContent=t.ic+' تجديد: '+(d.name||t.ar);
  let h='';
  if(e){
    h='<p class="note" style="margin-top:0">'+esc(cn)+' — '+esc(e.scope)+'</p><b>جهّز المستندات التالية:</b><ul class="check">'+e.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'
     +(e.note?'<div class="note">'+esc(e.note)+'</div>':'')
     +'<div class="note">المصدر الرسمي: <a href="'+esc(e.url)+'" target="_blank" rel="noopener">افتح الصفحة الرسمية</a> — آخر تحقق: '+esc(e.verified)+'</div>';
  }else{
    const home=window.OFFICIAL_HOME[d.country];
    h='<div class="upsell" style="text-align:right;margin-top:0">لم نوثّق بعد قائمة تجديد «'+esc(t.ar)+'» لدولة '+esc(cn)+'. القائمة أدناه عامة وإرشادية فقط، فراجع الجهة الرسمية قبل أن تعتمد عليها.'+(home?'<br><a href="'+esc(home)+'" target="_blank" rel="noopener">افتح الموقع الرسمي</a>':'')+'</div>'
     +'<b>قائمة عامة:</b><ul class="check">'+t.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  }
  h+='<div class="note">ابدأ التجديد قبل الانتهاء بوقت كافٍ، فالمتطلبات والرسوم تتغير. التطبيق لا يغني عن الجهة الرسمية.</div>';
  $('infoBody').innerHTML=h;
  openM('infoModal');
};
// تصدير حدث تقويم (ملف ics) بتذكيرات قبل 90 و30 و7 أيام
window.ics=function(id){
  const d=S.docs.find(x=>x.id===id);if(!d)return;const t=TYPES[d.type]||TYPES.other;const m=S.members.find(x=>x.id===d.member);
  const ymd=d.date.replace(/-/g,'');const nx=new Date(+d.date.slice(0,4),+d.date.slice(5,7)-1,+d.date.slice(8,10)+1);
  const end=nx.getFullYear()+String(nx.getMonth()+1).padStart(2,'0')+String(nx.getDate()).padStart(2,'0');
  const title=('تنتهي: '+(d.name||t.ar)+(m?' ('+m.name+')':'')).replace(/[\r\n,;]/g,' ');
  const al=[90,30,7].map(n=>'BEGIN:VALARM\r\nTRIGGER:-P'+n+'D\r\nACTION:DISPLAY\r\nDESCRIPTION:'+title+'\r\nEND:VALARM').join('\r\n');
  const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Awraqi//AR','BEGIN:VEVENT','UID:'+d.id+'@awraqi','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;VALUE=DATE:'+ymd,'DTEND;VALUE=DATE:'+end,'SUMMARY:'+title,al,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar'}));a.download='awraqi-'+d.id+'.ics';document.body.appendChild(a);a.click();a.remove();
  toast('افتح الملف لإضافته إلى تقويم هاتفك');
};

// ===== الشراء عبر Google Play Billing (داخل تطبيق Google Play فقط) =====
const SKU='awraqi_premium',BILL='https://play.google.com/billing';
const VURL='https://nwlmoecyepsajayyyugd.supabase.co/functions/v1/verify-purchase',VKEY='sb_publishable_rgaE-hjmqV37RU57_C8JEA_yn-0AcEO';
function verify(token){return fetch(VURL,{method:'POST',headers:{'Content-Type':'application/json',apikey:VKEY,Authorization:'Bearer '+VKEY},body:JSON.stringify({purchaseToken:token,sku:SKU})}).then(r=>r.json().then(d=>{if(!r.ok&&r.status>=500)throw new Error('server');return !!(d&&d.valid)}))}
let svc=null;
async function service(){if(svc)return svc;if(!('getDigitalGoodsService' in window))return null;try{svc=await window.getDigitalGoodsService(BILL)}catch(e){svc=null}return svc}
window.upgrade=async function(){
  const s=await service();if(!s){toast('الترقية متاحة من داخل تطبيق Google Play فقط');return}
  try{
    const req=new PaymentRequest([{supportedMethods:BILL,data:{sku:SKU}}],{total:{label:'Total',amount:{currency:'USD',value:'0'}}});
    const res=await req.show();const token=res.details&&res.details.purchaseToken;let ok=null;
    try{ok=token?await verify(token):false}catch(e){ok=null}
    if(ok===false){await res.complete('fail');toast('تعذّر التحقق من الشراء. تواصل معنا إن خُصم المبلغ.');return}
    if(ok===null&&token){try{await s.acknowledge(token,'onetime')}catch(e){}}
    await res.complete('success');S.premium=true;save();render();toast('🎉 تمت الترقية! شكرًا لك');
  }catch(e){toast('تعذّر إتمام الشراء. لم يُخصم شيء.')}
};
(async function(){
  const s=await service();if(!s)return;
  try{const [it]=await s.getDetails([SKU]);if(it&&it.price)window.__awPrice=it.price.value+' '+it.price.currency}catch(e){}
  try{
    const mine=(await s.listPurchases()).find(p=>p.itemId===SKU);
    if(!mine){if(S.premium){S.premium=false;save()}}
    else{let ok=null;try{ok=await verify(mine.purchaseToken)}catch(e){ok=null}
      if(ok===true&&!S.premium){S.premium=true;save()}else if(ok===false&&S.premium){S.premium=false;save()}}
  }catch(e){}
  render();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
})();
