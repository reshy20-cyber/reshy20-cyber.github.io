<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAYATI · حياتي</title>
<meta name="description" content="HAYATI — Personal life organizer: tasks, money, shopping, notes and habits.">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HAYATI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0f1720;--bg2:#1b2633;--card:#1c2733;--card2:#223040;--field:#121b24;--line:#2c3a49;
  --text:#f3ede2;--muted:#9aa6b2;--gold:#e0c27f;--gold-strong:#e0c27f;--g1:#e6cf93;--g2:#b8955a;--ink:#1a1408;
  --danger:#e48e8e;--ok:#86cfa6;--warn:#e9b86a;--shadow:0 10px 30px rgba(0,0,0,.35);
  --nav:rgba(18,26,35,.92);--chip:#18222d;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f1e9;--bg2:#ece5d7;--card:#ffffff;--card2:#fbf8f2;--field:#f7f3ec;--line:#e5dccb;
  --text:#1d232b;--muted:#69717c;--gold:#9a7230;--gold-strong:#8a6428;--g1:#e2c483;--g2:#bb914b;--ink:#1a1408;
  --danger:#c0504d;--ok:#2f8a5b;--warn:#b07418;--shadow:0 8px 24px rgba(60,45,20,.10);
  --nav:rgba(255,255,255,.94);--chip:#f1ebdf;
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root[data-theme="auto"]{
    --bg:#f5f1e9;--bg2:#ece5d7;--card:#ffffff;--card2:#fbf8f2;--field:#f7f3ec;--line:#e5dccb;
    --text:#1d232b;--muted:#69717c;--gold:#9a7230;--gold-strong:#8a6428;--g1:#e2c483;--g2:#bb914b;--ink:#1a1408;
    --danger:#c0504d;--ok:#2f8a5b;--warn:#b07418;--shadow:0 8px 24px rgba(60,45,20,.10);
    --nav:rgba(255,255,255,.94);--chip:#f1ebdf;
    color-scheme:light;
  }
}
:root[data-accent="emerald"]{--g1:#8fe0b8;--g2:#3fa37a;--gold:#8fd9b2;--gold-strong:#8fd9b2}
:root[data-theme="light"][data-accent="emerald"]{--gold:#2f8a5b;--gold-strong:#2f8a5b}
@media (prefers-color-scheme: light){:root[data-theme="auto"][data-accent="emerald"]{--gold:#2f8a5b;--gold-strong:#2f8a5b}}
:root[data-accent="sapphire"]{--g1:#a8c8f2;--g2:#4f7fc4;--gold:#a8c8f2;--gold-strong:#a8c8f2}
:root[data-theme="light"][data-accent="sapphire"]{--gold:#3b67a8;--gold-strong:#3b67a8}
@media (prefers-color-scheme: light){:root[data-theme="auto"][data-accent="sapphire"]{--gold:#3b67a8;--gold-strong:#3b67a8}}
:root[data-accent="rose"]{--g1:#f2b3c4;--g2:#c4687f;--gold:#f0aabd;--gold-strong:#f0aabd}
:root[data-theme="light"][data-accent="rose"]{--gold:#b0506a;--gold-strong:#b0506a}
@media (prefers-color-scheme: light){:root[data-theme="auto"][data-accent="rose"]{--gold:#b0506a;--gold-strong:#b0506a}}
:root[data-accent="violet"]{--g1:#cbb3f2;--g2:#7f5fc4;--gold:#c6adf0;--gold-strong:#c6adf0}
:root[data-theme="light"][data-accent="violet"]{--gold:#6a4bb0;--gold-strong:#6a4bb0}
@media (prefers-color-scheme: light){:root[data-theme="auto"][data-accent="violet"]{--gold:#6a4bb0;--gold-strong:#6a4bb0}}
.accents{display:flex;gap:10px;flex-wrap:wrap}
.accents button{width:40px;height:40px;border-radius:50%;border:2px solid transparent;color:#1a1408;font-weight:900}
.accents button.on{border-color:var(--text)}
.toggle{width:52px;height:30px;flex:0 0 52px;border-radius:99px;background:var(--field);border:1px solid var(--line);position:relative;display:grid;place-items:center;font-size:14px}
.toggle i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:all .2s}
.toggle.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent}
.toggle.on i{inset-inline-start:25px;background:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(1200px 600px at 50% -200px,var(--bg2),transparent 70%);
  background-attachment:fixed;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI","Noto Sans Arabic","Noto Sans",Tahoma,Arial,sans-serif;
  font-size:16px;line-height:1.5;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 100px)}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;border-radius:11px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.brand b{display:block;font-size:20px;letter-spacing:.14em;color:var(--gold);line-height:1.1;font-weight:800}
.brand small{display:block;font-size:9.5px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.iconbtn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--gold)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{background:var(--gold);color:var(--ink);border-color:transparent}

/* Hero */
.hero{margin:4px 0 18px}
.hero .hi{color:var(--muted);font-size:15px}
.hero h1{margin:2px 0 0;font-size:28px;line-height:1.25;font-weight:800}
.hero .date{color:var(--gold);font-size:14px;margin-top:4px}

/* Cards */
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 14px;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .sub{font-size:13px;font-weight:500;color:var(--muted)}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.title-row h2{margin:0}
.page-title{font-size:24px;font-weight:800;margin:0 0 14px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);text-align:start;width:100%}
.stat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold);margin-bottom:10px}
.stat .ic svg{width:18px;height:18px}
.stat .v{font-size:24px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:13px;font-weight:700;color:var(--muted);margin-inline-start:4px}
.stat .l{font-size:13px;color:var(--muted);margin-top:2px}
.stat.wide{grid-column:1/-1}
.bar{height:8px;border-radius:99px;background:var(--field);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .4s}
.bar.over i{background:var(--danger)}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.quick button svg{width:22px;height:22px;color:var(--gold)}

/* Forms */
.field{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;transition:border-color .2s}
.field:focus{border-color:var(--gold)}
.field::placeholder{color:var(--muted);opacity:.8}
textarea.field{resize:vertical;min-height:120px;line-height:1.7}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(12px) 55%,calc(17px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-start:30px}
[dir="ltr"] select.field{background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;padding-inline-start:14px;padding-inline-end:30px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:10px 2px 6px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1;min-width:0}
.gap{height:10px}
.btn{width:100%;border-radius:15px;padding:14px;font-weight:800;font-size:16px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--ink);box-shadow:0 6px 18px color-mix(in srgb,var(--g2) 30%,transparent);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--text);box-shadow:none;font-weight:600}
.btn.danger{background:transparent;border:1px solid color-mix(in srgb,var(--danger) 50%,transparent);color:var(--danger);box-shadow:none;font-weight:700}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.addbtn{width:42px;height:42px;border-radius:13px;flex:0 0 42px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--ink);display:grid;place-items:center}
.addbtn svg{width:22px;height:22px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:8px 13px;font-size:14px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;position:relative}
.chip.on{background:var(--gold);color:var(--ink);border-color:transparent;font-weight:700}
.chip svg{width:15px;height:15px}
.datefield svg{width:18px;height:18px;color:var(--gold)}
.datefield input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.chip.date input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.chip.date.set{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.chip.flag.on{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}

.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--gold);color:var(--ink);font-weight:800}

/* Lists */
.list{margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0;cursor:pointer}
.item .t{overflow-wrap:anywhere}
.item .m{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--gold) 70%,transparent);display:grid;place-items:center;transition:background .15s}
.check svg{width:15px;height:15px;opacity:0;color:var(--ink)}
.check.on{background:var(--gold);border-color:var(--gold)}
.check.on svg{opacity:1}
.check.sq{border-radius:8px}
.del{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);opacity:.75}
.del svg{width:17px;height:17px}
.del:active{color:var(--danger)}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip);border:1px solid var(--line)}
.c-over{color:var(--danger)}.c-today{color:var(--gold)}.c-ok{color:var(--ok)}
.prio{width:8px;height:8px;border-radius:50%;background:var(--danger);display:inline-block}
.count{min-width:30px;height:30px;padding:0 8px;border-radius:99px;border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);color:var(--gold);display:grid;place-items:center;font-size:14px;font-weight:700}

.empty{text-align:center;color:var(--muted);padding:26px 10px 14px}
.empty .e{font-size:36px;margin-bottom:6px}

/* Money */
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthnav b{font-size:18px}
.monthnav button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--gold)}
.monthnav svg{width:18px;height:18px}
[dir="ltr"] .flip-ltr svg,[dir="rtl"] .flip-rtl svg{transform:scaleX(-1)}
.bal{font-size:32px;font-weight:800;line-height:1.1}
.bal small{font-size:16px;color:var(--muted);font-weight:700;margin-inline-start:6px}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.io div{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.io span{display:block;font-size:12px;color:var(--muted)}
.io b{font-size:17px}
.budget-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:14px}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{width:120px;height:120px;flex:0 0 120px;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);line-height:1.3}
.donut .ctr b{display:block;color:var(--text);font-size:15px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend em{font-style:normal;color:var(--muted)}
.amt{font-weight:800;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.amt.inc{color:var(--ok)}
.emo{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--field);border:1px solid var(--line);display:grid;place-items:center;font-size:19px}

/* Notes */
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .field{padding-inline-start:40px}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:start;min-height:110px;display:flex;flex-direction:column;gap:6px;width:100%}
.note b{font-size:15px;overflow-wrap:anywhere}
.note p{margin:0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.note .d{margin-top:auto;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.note .d svg{width:14px;height:14px;color:var(--gold)}
.note.pinned{border-color:color-mix(in srgb,var(--gold) 55%,transparent)}

/* Habits */
.habit{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.habit .main{flex:1;min-width:0}
.habit .streak{font-size:13px;color:var(--muted)}
.habit .streak b{color:var(--gold)}
.dots{display:flex;gap:5px;margin-top:7px}
.dot{width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:var(--field);font-size:10px;color:var(--muted);display:grid;place-items:center}
.dot.on{background:color-mix(in srgb,var(--gold) 80%,transparent);color:var(--ink);border-color:transparent;font-weight:700}
.bigcheck{width:48px;height:48px;flex:0 0 48px;border-radius:15px;border:2px solid color-mix(in srgb,var(--gold) 60%,transparent);display:grid;place-items:center;color:var(--gold)}
.bigcheck svg{width:24px;height:24px}
.bigcheck.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--ink);border-color:transparent}
.emoji-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.emoji-pick button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-size:19px}
.emoji-pick button.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,transparent)}

/* Settings */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .k{font-weight:600}
.setrow .k small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.setrow .field{width:auto;min-width:120px;padding:9px 12px}
.langs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.langs .chip{justify-content:center}
.cloud-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--field);border:1px solid var(--line);margin-bottom:10px;overflow-wrap:anywhere}
.cloud-user i{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:0 0 9px}
.cloud-msg{font-size:13px;color:var(--muted);margin:10px 2px 0;text-align:center}
.lockrow{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--gold) 55%,transparent);background:color-mix(in srgb,var(--gold) 8%,transparent);color:var(--text);font-size:14px;text-align:start}
.lockrow span{flex:1}
.lockrow b{color:var(--gold);font-size:13px}
.iconbtn.crown{font-size:19px;filter:grayscale(.2)}
.iconbtn.crown.pro{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent}
.pro-hero{text-align:center;padding:6px 0 4px}
.pro-hero .k{font-size:44px;line-height:1}
.pro-hero h3{margin:8px 0 4px;font-size:22px}
.pro-hero p{margin:0;color:var(--muted);font-size:14px}
.pro-list{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:10px}
.pro-list li{display:flex;gap:12px;align-items:flex-start;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px}
.pro-list li span{font-size:22px;line-height:1.2}
.pro-list li b{display:block}
.pro-list li small{color:var(--muted)}
.pro-price{text-align:center;margin:4px 0 14px}
.pro-price b{font-size:28px;color:var(--gold)}
.pro-price small{display:block;color:var(--muted)}
.pro-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--ink);font-weight:800;font-size:13px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;color:var(--muted);font-size:10.5px;position:relative}
.nav button svg{width:22px;height:22px}
.nav button span:not(.badge){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.nav button.on{color:var(--gold);font-weight:700}
.nav button.on::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}

<script>
(function(){
'use strict';

/* ---------------- Storage ---------------- */
var KEY = 'hayati_v2';
var LANG_NAMES=[['ar','العربية'],['en','English'],['fr','Français'],['es','Español'],['de','Deutsch'],['it','Italiano'],['pt','Português'],['tr','Türkçe'],['zh','中文'],['hi','हिन्दी']];
var LANG_CODES=['ar','en','fr','es','de','it','pt','tr','zh','hi'];
function defaults(){return {v:2,lang:'ar',theme:'auto',currency:'GBP',budget:0,tasks:[],tx:[],shop:[],notes:[],habits:[],premium:{active:false,checked:0},gift:false,accent:'gold'};}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
/* Language and currency from the phone's settings (used only on first launch). */
function deviceLocale(){
  var list=[];try{list=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'']);}catch(e){}
  var lang='en',region='';
  for(var i=0;i<list.length;i++){
    var code=String(list[i]||'').toLowerCase().split(/[-_]/)[0];
    if(LANG_CODES.indexOf(code)>-1){lang=code;break;}
  }
  for(var j=0;j<list.length;j++){var m=String(list[j]||'').match(/[-_]([A-Za-z]{2})\b/);if(m){region=m[1].toUpperCase();break;}}
  var EUR='AT BE CY DE EE ES FI FR GR HR IE IT LT LU LV MT NL PT SI SK'.split(' ');
  var MAP={SA:'SAR',AE:'AED',KW:'KWD',QA:'QAR',BH:'BHD',OM:'OMR',EG:'EGP',JO:'JOD',MA:'MAD',DZ:'DZD',TN:'TND',IQ:'IQD',LB:'LBP',US:'USD',GB:'GBP',TR:'TRY',IN:'INR',CN:'CNY',BR:'BRL',MX:'MXN',CH:'CHF',CA:'CAD',AU:'AUD'};
  var cur=MAP[region]||(EUR.indexOf(region)>-1?'EUR':'');
  if(!cur){cur={ar:'SAR',fr:'EUR',es:'EUR',de:'EUR',it:'EUR',pt:'EUR',tr:'TRY',zh:'CNY',hi:'INR'}[lang]||'USD';}
  return {lang:lang,currency:cur};
}
function load(){
  var d=null;
  try{d=JSON.parse(lsGet(KEY));}catch(e){}
  if(!d||typeof d!=='object'){
    d=defaults();
    var dev=deviceLocale();d.lang=dev.lang;d.currency=dev.currency;   // first launch: follow the phone's language & region
    try{migrate(d);}catch(e){}
  }
  var base=defaults();
  for(var k in base){if(d[k]===undefined)d[k]=base[k];}
  ['tasks','tx','shop','notes','habits'].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[];});
  return d;
}
function save(){
  lsSet(KEY,JSON.stringify(S));
  if(!syncQuiet&&isDirty())scheduleSync();
  try{var L=toLegacy(S);lsSet(LEGACY+'tasks',JSON.stringify(L.tasks));lsSet(LEGACY+'expenses',JSON.stringify(L.expenses));lsSet(LEGACY+'shopping',JSON.stringify(L.shopping));lsSet(LEGACY+'habits',JSON.stringify(L.habits));lsSet(LEGACY+'notes',JSON.stringify(L.notes));lsSet('hayati_language',S.lang);}catch(e){}
}

/* ---------------- Legacy (previous HAYATI version) ----------------
   The previous version stored data under hayati_v2_tasks / _expenses / _shopping / _habits / _notes
   and the language under hayati_language. We import it once, and keep writing those keys too,
   so an older copy of the app (or a rollback) still sees the same data. */
var LEGACY='hayati_v2_';
var SYNC_KEY='hayati_sync',syncQuiet=false,syncTimer=null;
function syncMeta(){try{return JSON.parse(lsGet(SYNC_KEY))||{last:0,hash:''};}catch(e){return {last:0,hash:''};}}
function dataHash(){var str=JSON.stringify([S.tasks,S.tx,S.shop,S.notes,S.habits,S.budget,S.currency]),h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return String(h);}
function isEmptyData(){return !S.tasks.length&&!S.tx.length&&!S.shop.length&&!S.notes.length&&!S.habits.length;}
function isDirty(){if(isEmptyData())return false;return dataHash()!==syncMeta().hash;}
function setSyncMeta(m){lsSet(SYNC_KEY,JSON.stringify(m));}
function autoSyncOn(){return typeof cloud!=='undefined'&&!!(cloud&&cloud.client&&cloud.user)&&isPro()&&S.autoSync!==false;}
function scheduleSync(){if(!autoSyncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(pushNow,3000);}
function migrate(d){
  var found=false,p={};
  ['tasks','expenses','shopping','habits'].forEach(function(k){
    var raw=lsGet(LEGACY+k);if(raw==null)return;
    try{var v=JSON.parse(raw);if(Array.isArray(v)){p[k]=v;found=true;}}catch(e){}
  });
  var nr=lsGet(LEGACY+'notes');
  if(nr!=null){var nv;try{nv=JSON.parse(nr);}catch(e){nv=nr;}if(typeof nv==='string'){p.notes=nv;found=true;}}
  var lg=lsGet('hayati_language');
  if(lg&&LANG_CODES.indexOf(lg)>-1)d.lang=lg;
  else if(found)d.lang='ar';
  if(found){importLegacy(d,p);d.currency='GBP';if(d.tasks.length||d.tx.length||d.shop.length||d.habits.length||d.notes.length){d.gift=true;d.giftNew=true;}lsSet(KEY,JSON.stringify(d));}
}
/* Convert a payload in the old format (also used by old cloud backups / backup files) into our data. */
function importLegacy(d,p){
  var td=iso(new Date());
  (p.tasks||[]).forEach(function(o){
    if(!o||typeof o!=='object')return;
    var title=String(o.title||o.name||'').trim();if(!title)return;
    d.tasks.push({id:o.id||uid(),title:title,due:typeof o.due==='string'?o.due.slice(0,10):'',prio:(o.prio===1||o.priority==='high')?1:0,
      rep:/^(daily|weekly|monthly)$/.test(o.rep)?o.rep:'none',done:!!o.done,created:o.created||Date.now()});
  });
  (p.expenses||[]).forEach(function(o){
    if(!o||typeof o!=='object')return;
    var a=Number(o.amount);if(!(a>0))return;
    d.tx.push({id:o.id||uid(),type:o.type==='inc'?'inc':'exp',amount:Math.round(a*100)/100,cur:/^[A-Z]{3}$/.test(o.cur)?o.cur:'GBP',
      cat:o.cat||'other',note:String(o.note!=null?o.note:(o.desc||'')),date:/^\d{4}-\d{2}-\d{2}$/.test(o.date)?o.date:td});
  });
  (p.shopping||[]).forEach(function(o){
    if(!o||typeof o!=='object')return;
    var n=String(o.name||'').trim();if(!n)return;
    d.shop.push({id:o.id||uid(),name:n,qty:String(o.qty||''),done:!!o.done});
  });
  (p.habits||[]).forEach(function(o){
    if(!o||typeof o!=='object')return;
    var n=String(o.name||'').trim();if(!n)return;
    var log={};(Array.isArray(o.days)?o.days:[]).forEach(function(x){if(typeof x==='string')log[x]=1;});
    d.habits.push({id:o.id||uid(),name:n,emoji:o.emoji||'🎯',log:log,created:o.created||Date.now()});
  });
  if(typeof p.notes==='string'&&p.notes.trim())d.notes.push({id:uid(),title:'',body:p.notes,pinned:false,updated:Date.now()});
}
/* Our data in the old format (extra fields are ignored by the old version). */
function toLegacy(d){
  return {
    tasks:d.tasks.map(function(x){return {name:x.title,done:x.done,priority:x.prio?'high':'normal',due:x.due,id:x.id,rep:x.rep,created:x.created};}),
    expenses:d.tx.filter(function(x){return x.type==='exp';}).map(function(x){return {amount:x.amount,desc:x.note,id:x.id,cur:x.cur,cat:x.cat,date:x.date};}),
    shopping:d.shop.map(function(x){return {name:x.name,done:x.done,qty:x.qty,id:x.id};}),
    habits:d.habits.map(function(x){return {name:x.name,days:Object.keys(x.log).filter(function(k){return x.log[k];}).sort(),id:x.id,emoji:x.emoji};}),
    notes:d.notes.map(function(n){return (n.title?n.title+'\n':'')+n.body;}).join('\n\n———\n\n')
  };
}
/* Accept: our own format, a payload with .app (new cloud/backup), or the old format. */
function dataFromPayload(v){
  if(!v||typeof v!=='object')return null;
  var src=(v.app&&Array.isArray(v.app.tasks))?v.app:(Array.isArray(v.tx)?v:null);
  var d=defaults();
  if(src){for(var k in d)if(src[k]!==undefined)d[k]=src[k];['tasks','tx','shop','notes','habits'].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[];});return d;}
  if(Array.isArray(v.tasks)){importLegacy(d,v);d.gift=true;d.giftNew=true;return d;}
  return null;
}

/* ---------------- Utils ---------------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return (n<10?'0':'')+n;}
function iso(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function today(){return iso(new Date());}
function addDays(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);}
function addMonths(s,n){var d=parseISO(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d);}
function ym(s){return s.slice(0,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function newTask(title){return {id:uid(),title:title,due:'',prio:0,rep:'none',done:false,created:Date.now()};}

function fmtMonth(m){try{return new Intl.DateTimeFormat(locale(),{month:'long',year:'numeric'}).format(parseISO(m+'-01'));}catch(e){return m;}}
function money(n){var v=Math.round(n*100)/100;return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function moneyShort(n){return Math.abs(n)>=100000?Math.round(n).toLocaleString('en-US'):money(n);}

  r.setAttribute('data-accent',isPro()?(S.accent||'gold'):'gold');

  var dark=S.theme==='dark'||(S.theme==='auto'&&!(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches));
  var m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0f1720':'#f5f1e9';
}

/* ---------------- Computations ---------------- */
function dueInfo(task){
  if(!task.due)return null;
  var td=today();
  if(task.done)return {cls:'',txt:fmtDate(task.due)};
  if(task.due<td)return {cls:'c-over',txt:t('overdue')+' · '+fmtDate(task.due)};
  if(task.due===td)return {cls:'c-today',txt:t('today')};
  if(task.due===addDays(td,1))return {cls:'',txt:t('tomorrow')};
  return {cls:'',txt:fmtDate(task.due)};
}
function sortTasks(a){
  return a.slice().sort(function(x,y){
    if(x.done!==y.done)return x.done?1:-1;
    var dx=x.due||'9999',dy=y.due||'9999';
    if(dx!==dy)return dx<dy?-1:1;
    if(x.prio!==y.prio)return y.prio-x.prio;
    return x.created-y.created;
  });
}
function monthTotals(m){
  var r={exp:0,inc:0,other:{},byCat:{}};
  S.tx.forEach(function(x){
    if(ym(x.date)!==m)return;
    if(x.cur!==S.currency){var o=r.other[x.cur]||(r.other[x.cur]={exp:0,inc:0});o[x.type]+=x.amount;return;}
    r[x.type]+=x.amount;
    if(x.type==='exp')r.byCat[x.cat]=(r.byCat[x.cat]||0)+x.amount;
  });
  return r;
}
function streak(h){
  var d=today(),n=0;
  if(!h.log[d])d=addDays(d,-1);
  while(h.log[d]){n++;d=addDays(d,-1);}
  return n;
}
function bestStreak(h){
  var days=Object.keys(h.log).filter(function(k){return h.log[k];}).sort(),best=0,cur=0,prev=null;
  days.forEach(function(d){cur=(prev&&addDays(prev,1)===d)?cur+1:1;if(cur>best)best=cur;prev=d;});
  return best;
}

function reportCard(m,mt){
  var prev=ym(addMonths(m+'-01',-1)),pt=monthTotals(prev);
  var td=today(),daysIn=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();

  if(!mt.exp&&!mt.inc&&!pt.exp)return '';

    ['📉',t('rep_vs_last'),change===null?'—':(change>0?'▲ ':change<0?'▼ ':'')+Math.abs(change)+'%',change===null?'':change>0?'c-over':'c-ok'],

  ];

/* ---------------- Sheet / Toast ---------------- */
var sheetRoot=document.getElementById('sheetRoot'),sheetClose=null;
function openSheet(html,onClose){
  closeSheet(true);
  sheetRoot.innerHTML='<div class="overlay" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div>';
  sheetClose=onClose||null;
  requestAnimationFrame(function(){var o=sheetRoot.querySelector('.overlay'),s=sheetRoot.querySelector('.sheet');if(o)o.classList.add('show');if(s)s.classList.add('show');});
}
function closeSheet(instant){
  if(!sheetRoot.firstChild)return;
  var cb=sheetClose;sheetClose=null;if(cb)cb();
  if(instant){sheetRoot.innerHTML='';return;}
  var o=sheetRoot.querySelector('.overlay'),s=sheetRoot.querySelector('.sheet');
  if(o)o.classList.remove('show');if(s)s.classList.remove('show');
  setTimeout(function(){sheetRoot.innerHTML='';},220);
}
var toastEl=document.getElementById('toast'),toastTimer=null,toastUndo=null;
function toast(msg,undo){
  document.getElementById('toastMsg').textContent=msg;
  var b=document.getElementById('toastBtn');
  toastUndo=undo||null;b.textContent=undo?t('undo'):'';b.style.display=undo?'':'none';
  toastEl.classList.add('show');clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show');toastUndo=null;},undo?5000:2200);
}
document.getElementById('toastBtn').addEventListener('click',function(){if(toastUndo){toastUndo();toastUndo=null;save();render();}toastEl.classList.remove('show');});

function removeWithUndo(arrName,id){
  var arr=S[arrName],i=-1;
  for(var k=0;k<arr.length;k++)if(arr[k].id===id){i=k;break;}
  if(i<0)return;
  var item=arr.splice(i,1)[0];save();render();
  toast(t('deleted'),function(){S[arrName].splice(Math.min(i,S[arrName].length),0,item);});
}
function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}

/* ---------------- Actions ---------------- */
function nextDue(d,rep){return rep==='daily'?addDays(d,1):rep==='weekly'?addDays(d,7):addMonths(d,1);}
function toggleTask(id){
  var x=find(S.tasks,id);if(!x)return;
  if(!x.done&&x.rep!=='none'){
    var prev=x.due;
    var base=x.due||today();
    var nd=nextDue(base,x.rep);
    while(nd<today())nd=nextDue(nd,x.rep);
    x.due=nd;save();render();
    toast(t('next_on')+' '+fmtDate(nd),function(){x.due=prev;});
    return;
  }
  x.done=!x.done;x.doneAt=x.done?Date.now():0;save();render();
  if(x.done)toast(t('done_msg'),function(){x.done=false;});
}

  var el=e.target.closest('[data-act]');if(!el)return;

      break;

    case 'draft-rep':if(!isPro()){paywall(t('pro_rep_reason'));break;}var reps=['none','daily','weekly','monthly'];ui.draft.rep=reps[(reps.indexOf(ui.draft.rep)+1)%4];render();break;
    case 'task-toggle':toggleTask(id);break;
    case 'task-edit':taskSheet(find(S.tasks,id));break;
    case 'task-del':closeSheet(true);removeWithUndo('tasks',id);break;
    case 'sheet-prio':e.preventDefault();var cb=el.querySelector('input');cb.checked=!cb.checked;el.classList.toggle('on',cb.checked);break;
    case 'sheet-due-clear':var di=sheetRoot.querySelector('input[name=due]');if(di){di.value='';di.parentNode.querySelector('span').textContent=t('no_date');}break;
    case 'sheet-close':closeSheet();break;
    case 'confirm-yes':var f=confirmFn;confirmFn=null;closeSheet(true);if(f)f();break;
    case 'month':var d=parseISO(ui.month+'-01');d.setMonth(d.getMonth()+(+v));ui.month=ym(iso(d));render();break;
    case 'txtype':ui.txType=v;render();break;
    case 'txcat':e.preventDefault();ui.txDraft.cat=v;
      el.parentNode.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c===el);});break;
    case 'tx-del':removeWithUndo('tx',id);break;
    case 'budget':if(!isPro()){paywall();break;}ui.tab='settings';render();setTimeout(function(){var i=app.querySelector('[data-change=budget]');if(i)i.focus();},50);break;
    case 'shop-toggle':var s=find(S.shop,id);if(s){s.done=!s.done;save();render();}break;
    case 'shop-del':removeWithUndo('shop',id);break;
    case 'shop-clear':var removed=S.shop.filter(function(x){return x.done;});S.shop=S.shop.filter(function(x){return !x.done;});save();render();
      toast(t('deleted'),function(){S.shop=S.shop.concat(removed);});break;
    case 'shop-share':shareShop();break;
    case 'note-new':if(!canAddNote())break;var nn={id:uid(),title:'',body:'',pinned:false,updated:Date.now()};S.notes.push(nn);noteSheet(nn);break;
    case 'note-open':var no=find(S.notes,id);if(no)noteSheet(no);break;
    case 'note-pin':var np=find(S.notes,id);if(np){np.pinned=!np.pinned;save();el.classList.toggle('on',np.pinned);}break;

document.addEventListener('submit',function(e){
  var f=e.target,a=f.getAttribute('data-submit');if(!a)return;
  e.preventDefault();
  var fd=new FormData(f);
  if(a==='task-add'){
    var title=String(fd.get('title')||'').trim();if(!title)return;
    var x=newTask(title);x.due=ui.draft.due;x.prio=ui.draft.prio;x.rep=ui.draft.rep;
    if(x.rep!=='none'&&!x.due)x.due=today();
    f.reset();S.tasks.push(x);ui.draft={due:'',prio:0,rep:'none'};save();render();
    var i=app.querySelector('input[name=title]');if(i)i.focus();
  }else if(a==='task-save'){
    var id=f.getAttribute('data-id');
    var tt=String(fd.get('title')||'').trim();if(!tt)return;
    var task=id?find(S.tasks,id):null;
    if(!task){task=newTask(tt);S.tasks.push(task);}
    task.title=tt;task.due=String(fd.get('due')||'');task.rep=fd.get('rep')!=null?String(fd.get('rep')):(task.rep||'none');task.prio=fd.get('prio')?1:0;
    if(task.rep!=='none'&&!task.due)task.due=today();
    save();closeSheet(true);render();
  }else if(a==='tx-add'){
    var amt=parseFloat(String(fd.get('amount')||'').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(',','.'));
    if(!(amt>0)){var ai=f.querySelector('[name=amount]');ai.focus();ai.style.borderColor='var(--danger)';return;}
    S.tx.push({id:uid(),type:ui.txType,amount:Math.round(amt*100)/100,cur:String(fd.get('cur')||S.currency),cat:isPro()?ui.txDraft.cat:(ui.txType==='inc'?'other':'other'),note:String(fd.get('note')||'').trim(),date:ui.txDraft.date||today()});
    f.reset();ui.month=ym(ui.txDraft.date||today());ui.txDraft.date='';
    save();render();toast(t('done_msg'));
  }else if(a==='shop-add'){
    var nm=String(fd.get('name')||'').trim();if(!nm)return;
    f.reset();S.shop.push({id:uid(),name:nm,qty:String(fd.get('qty')||'').trim(),done:false});save();render();
    var si=app.querySelector('input[name=name]');if(si)si.focus();
  }else if(a==='auth'){
    var mode=(e.submitter&&e.submitter.value)||'signin';
    signInOrUp(mode,String(fd.get('email')||'').trim(),String(fd.get('password')||''));
    return;
  }else if(a==='habit-add'){
    if(!isPro()&&S.habits.length>=FREE_HABITS){paywall(t('limit_habits').replace('{n}',FREE_HABITS));return;}
    var hn=String(fd.get('name')||'').trim();if(!hn)return;
    f.reset();S.habits.push({id:uid(),name:hn,emoji:ui.habitEmoji,log:{},created:Date.now()});save();render();
  }
});

var PREMIUM_SKU='hayati_premium';
var PLAY_PACKAGE='app.hayati.organizer'; // Google Play link shown on the website's paywall

/* The apps are sold only on Google Play, so the locks apply everywhere: on the website the paywall
     points to the Google Play app, which is the only place Premium can be bought.

var PREVIEW_FREE=/[?&#]preview=free/.test(location.search+location.hash);
try{if(PREVIEW_FREE)sessionStorage.setItem('hayati_preview','1');else if(/[?&#]preview=off/.test(location.search+location.hash))sessionStorage.removeItem('hayati_preview');PREVIEW_FREE=PREVIEW_FREE||sessionStorage.getItem('hayati_preview')==='1';}catch(e){}

function verifyPurchase(token){
  if(!cloud.client||!cloud.client.functions)return Promise.reject(new Error('offline'));
  return cloud.client.functions.invoke('verify-purchase',{body:{purchaseToken:token,sku:PREMIUM_SKU}}).then(function(r){
    if(r.error)throw r.error;
    return !!(r.data&&r.data.valid);
  });
}
function initBilling(){
  if(!('getDigitalGoodsService' in window))return;
  window.getDigitalGoodsService('https://play.google.com/billing').then(function(service){
    billing.service=service;
    service.getDetails([PREMIUM_SKU]).then(function(items){
      var it=items&&items[0];
      if(it&&it.price){try{billing.price=new Intl.NumberFormat(locale(),{style:'currency',currency:it.price.currency,currencyDisplay:'narrowSymbol'}).format(it.price.value);}catch(e){billing.price=it.price.value+' '+it.price.currency;}}
      if(sheetRoot.querySelector('.pro-price b'))sheetRoot.querySelector('.pro-price b').textContent=billing.price;
    }).catch(function(){});

function restorePurchases(manual){
  if(!billing.service){if(manual)toast(t('pro_only_play'));return;}
  billing.service.listPurchases().then(function(list){
    var p=(list||[]).filter(function(x){return x.itemId===PREMIUM_SKU;})[0];
    if(!p){setPro(false);if(manual)toast(t('pro_none'));return;}
    return verifyPurchase(p.purchaseToken).then(function(ok){
      setPro(ok);
      if(manual)toast(ok?t('pro_thanks'):t('pro_fail'));
    }).catch(function(){
      // could not reach the server: trust Play's list for now, check again next launch
      setPro(true);
    });
  }).catch(function(){if(manual)toast(t('pro_fail'));});
}
function buyPremium(){
  if(!billing.service||billing.busy)return;
  if(!window.PaymentRequest){toast(t('pro_fail'));return;}
  billing.busy=true;
  var req;
  try{
    req=new PaymentRequest([{supportedMethods:'https://play.google.com/billing',data:{sku:PREMIUM_SKU}}],{total:{label:'Total',amount:{currency:'USD',value:'0'}}});
  }catch(e){billing.busy=false;toast(t('pro_fail'));return;}
  req.show().then(function(res){
    var token=res.details&&res.details.purchaseToken;
    return verifyPurchase(token).then(function(ok){
      return res.complete(ok?'success':'fail').then(function(){
        billing.busy=false;
        if(ok){closeSheet(true);setPro(true);toast(t('pro_thanks'));}
        else toast(t('pro_fail'));
      });
    }).catch(function(){
      return res.complete('fail').then(function(){billing.busy=false;toast(t('pro_fail'));});
    });
  }).catch(function(){billing.busy=false;/* cancelled by the user */});
}
/* Google Play review: a code given to reviewers in Play Console (App access) turns Premium on, on this device only. Only its SHA-256 is kept here. */
var REVIEW_HASH='94c33529e72e454a5b4b3cab1ac071ca56a7b609edf85bd034dd060a96a9232d';
function redeemCode(){
  var c=(window.prompt(S.lang==='ar'?'اكتب الرمز':'Enter the code')||'').trim().toUpperCase();if(!c)return;
  if(!(window.crypto&&crypto.subtle)){toast(S.lang==='ar'?'هذا الرمز غير صحيح':'This code isn\'t valid');return;}
  crypto.subtle.digest("SHA-256",new TextEncoder().encode(c)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}).then(function(h){
    if(h!==REVIEW_HASH){toast(S.lang==='ar'?'هذا الرمز غير صحيح':'This code isn\'t valid');return;}
    S.gift=true;save();closeSheet(true);render();toast(t('pro_thanks'));
  });
}

var cloud={client:null,user:null,msg:'',busy:false};
try{
  if(window.supabase&&window.supabase.createClient){
    cloud.client=window.supabase.createClient('https://nwlmoecyepsajayyyugd.supabase.co','sb_publishable_rgaE-hjmqV37RU57_C8JEA_yn-0AcEO',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

function cloudMsg(m){cloud.msg=m;var el=document.getElementById('cloudMsg');if(el)el.textContent=m;else if(m)toast(m);}
function setCloudUser(u){var changed=(cloud.user&&cloud.user.id)!==(u&&u.id);cloud.user=u||null;if(changed&&ui.tab==='settings')render();if(changed&&u)setTimeout(pullCheck,300);}
function cloudBusy(b){cloud.busy=b;if(ui.tab==='settings')render();}
function refreshCloudUser(){
  if(!cloud.client)return Promise.resolve(null);
  return cloud.client.auth.getUser().then(function(r){if(r.error)throw r.error;setCloudUser(r.data.user);return r.data.user;})

function signInOrUp(mode,email,password){
  if(!cloud.client)return cloudMsg(A('unavailable'));
  if(!email||password.length<6)return cloudMsg(A('credentials'));
  cloudBusy(true);cloudMsg(A('wait'));
  var p=mode==='signup'
    ?cloud.client.auth.signUp({email:email,password:password,options:{emailRedirectTo:location.origin+location.pathname}})
    :cloud.client.auth.signInWithPassword({email:email,password:password});
  p.then(function(r){
    if(r.error)throw r.error;
    if(mode==='signup'&&!r.data.session){cloud.busy=false;cloudMsg(A('confirmEmail'));render();return;}
    return refreshCloudUser().then(function(){cloud.busy=false;cloud.msg=A('loginSuccess');render();});
  }).catch(function(err){cloud.busy=false;cloud.msg=A('loginError')+(err&&err.message||'');render();});
}
function cloudPayload(){var L=toLegacy(S);return {format:'hayati-cloud-v1',tasks:L.tasks,expenses:L.expenses,shopping:L.shopping,habits:L.habits,notes:L.notes,app:stripPremium(S)};}
function pushNow(){
  if(!autoSyncOn()||cloud.pushing)return Promise.resolve();
  cloud.pushing=true;
  var at=new Date().toISOString();
  return cloud.client.from('hayati_data').upsert({user_id:cloud.user.id,payload:cloudPayload(),updated_at:at},{onConflict:'user_id'}).then(function(r){
    cloud.pushing=false;if(r.error)throw r.error;
    setSyncMeta({last:Date.parse(at),hash:dataHash()});
    var el=document.getElementById('syncState');if(el)el.textContent=syncLabel();
  }).catch(function(){cloud.pushing=false;});
}
function applyCloud(d,at){
  syncQuiet=true;try{replaceData(d);}finally{syncQuiet=false;}
  setSyncMeta({last:at,hash:dataHash()});
  var el=document.getElementById('syncState');if(el)el.textContent=syncLabel();
}
function pullCheck(){
  if(!autoSyncOn()||cloud.pulling)return;
  cloud.pulling=true;
  cloud.client.from('hayati_data').select('payload,updated_at').eq('user_id',cloud.user.id).maybeSingle().then(function(r){
    cloud.pulling=false;
    if(r.error)return;
    var m=syncMeta(),dirty=isDirty();
    if(!r.data){if(!isEmptyData())pushNow();return;}
    var at=Date.parse(r.data.updated_at)||0;
    if(at>m.last+1000){
      var d=dataFromPayload(r.data.payload);if(!d)return;
      if(!dirty){applyCloud(d,at);toast('☁️ '+t('synced'));}
      else syncConflict(d,at);
    }else if(dirty)pushNow();
  }).catch(function(){cloud.pulling=false;});
}
function syncConflict(d,at){
  openSheet('<h3>☁️ '+esc(t('sync_conflict'))+'</h3><div class="acts" style="flex-direction:column"><button class="btn" data-act="sync-cloud">'+esc(t('keep_cloud'))+'</button><button class="btn ghost" data-act="sync-device">'+esc(t('keep_device'))+'</button></div>');
  cloud.conflict={d:d,at:at};
}
function syncLabel(){
  var m=syncMeta();
  if(!m.last)return t('sync_never');
  var d=new Date(m.last);
  return t('sync_last')+' '+fmtDate(iso(d),{day:'numeric',month:'short'})+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function cloudUpload(){
  refreshCloudUser().then(function(user){
    if(!user)return cloudMsg(A('signInFirst'));
    confirmSheet(A('uploadConfirm'),A('upload'),function(){
      var payload=cloudPayload(),at=new Date().toISOString();
      cloudBusy(true);cloudMsg(A('uploading'));
      cloud.client.from('hayati_data').upsert({user_id:user.id,payload:payload,updated_at:at},{onConflict:'user_id'})
        .then(function(r){if(r.error)throw r.error;setSyncMeta({last:Date.parse(at),hash:dataHash()});cloud.busy=false;cloud.msg=A('uploadSuccess');render();})
        .catch(function(err){cloud.busy=false;cloud.msg=A('uploadError')+(err&&err.message||'');render();});
    });
  });
}
function cloudRestore(){
  refreshCloudUser().then(function(user){
    if(!user)return cloudMsg(A('signInFirst'));
    cloudBusy(true);cloudMsg(A('checking'));
    cloud.client.from('hayati_data').select('payload,updated_at').eq('user_id',user.id).maybeSingle().then(function(r){
      if(r.error)throw r.error;
      cloud.busy=false;
      if(!r.data){cloud.msg=A('noBackup');render();return;}
      var d=dataFromPayload(r.data.payload);
      if(!d)throw new Error(A('invalidCloud'));
      var preview=d.tasks.slice(0,3).map(function(x){return x.title;}).join('، ');
      cloud.msg='';render();
      confirmSheet(A('restoreConfirm').replace('{count}',String(d.tasks.length)).replace('{preview}',preview?' ('+preview+')':''),A('restore'),function(){
        applyCloud(d,Date.parse(r.data.updated_at)||Date.now());cloud.msg=A('restoreSuccess');render();toast(A('restoreSuccess'));
      });
    }).catch(function(err){cloud.busy=false;cloud.msg=A('restoreError')+(err&&err.message||'');render();});
  });
}
if(cloud.client){
  try{cloud.client.auth.onAuthStateChange(function(_e,session){setCloudUser(session&&session.user||null);});}catch(e){}
  refreshCloudUser();
}

if(window.matchMedia){try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(){if(S.theme==='auto')applyTheme();});}catch(e){}}

document.addEventListener('visibilitychange',function(){if(document.hidden){if(autoSyncOn()&&isDirty()){clearTimeout(syncTimer);pushNow();}return;}if(today()!==lastDay){lastDay=today();render();}pullCheck();});

/* Keep our bottom bar above any bar the hosting service fixes to the bottom of the page. */
function measureHostBar(){
  var mine={app:1,nav:1,sheetRoot:1,toast:1,importFile:1},h=0,vh=window.innerHeight;
  var els=document.body.querySelectorAll('body > *');
  for(var i=0;i<els.length;i++){
    var el=els[i];if(mine[el.id]||el.tagName==='SCRIPT'||el.tagName==='STYLE'||el.tagName==='LINK')continue;
    var cs=getComputedStyle(el);if(cs.position!=='fixed'&&cs.position!=='sticky')continue;
    if(cs.display==='none'||cs.visibility==='hidden')continue;
    var r=el.getBoundingClientRect();
    if(r.height>0&&r.height<vh*0.5&&r.bottom>=vh-4&&r.top>vh*0.4)h=Math.max(h,Math.round(vh-r.top));
  }
  document.documentElement.style.setProperty('--bh',h+'px');
}
try{
  new MutationObserver(function(){measureHostBar();}).observe(document.body,{childList:true,subtree:false,attributes:true,attributeFilter:['style','class']});
  window.addEventListener('resize',measureHostBar);
  window.addEventListener('load',function(){measureHostBar();setTimeout(measureHostBar,800);setTimeout(measureHostBar,2500);});
  measureHostBar();
}catch(e){}

render();
initBilling();

  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){try{reg.update();}catch(e){}}).catch(function(){});
  });
}
})();
