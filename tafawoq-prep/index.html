<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تفوق">
<link rel="manifest" href="./manifest.webmanifest?v=2">
<link rel="icon" href="./icon-192.png?v=2" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png?v=2">
<title>تفوق إعدادي</title>
<meta name="theme-color" content="#6244a9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@600;700;800&display=swap">
<style>
/* Layout: phone-first single column (max 600px), sticky screen bar, fixed bottom tab bar. Exam mode hides the tab bar. */
:root{
  --bg:#f2f7fa;--surface:#ffffff;--surface-2:#e7f2f8;--line:#d5e5ee;
  --fg:#15324a;--muted:#5d7486;--accent:#6244a9;--accent-ink:#ffffff;--accent-soft:#ece6f8;--accent-deep:#47308a;
  --good:#138a55;--good-soft:#e2f5ea;--bad:#c63c3c;--bad-soft:#fcebea;--warn:#a96f12;--warn-soft:#fff3dc;
  --paper:#fff7f2;--paper-line:#e7b4a2;--paper-ink:#8a3b25;--pencil:#26272c;--shadow:0 2px 10px rgba(16,60,90,.06);
  --font-body:'Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --font-display:'Cairo','Noto Sans Arabic',system-ui,-apple-system,sans-serif;
  --font-math:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110f1d;--surface:#1a1729;--surface-2:#241f38;--line:#332c4d;
  --fg:#e2edf4;--muted:#93aabb;--accent:#a98ef0;--accent-ink:#1b1036;--accent-soft:#2c2350;--accent-deep:#cdbdf7;
  --good:#4fc88b;--good-soft:#123528;--bad:#f08080;--bad-soft:#3a1c1f;--warn:#e6b45c;--warn-soft:#382b13;
  --paper:#26211f;--paper-line:#6d4b40;--paper-ink:#f0b9a5;--pencil:#f3ede6;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110f1d;--surface:#1a1729;--surface-2:#241f38;--line:#332c4d;
  --fg:#e2edf4;--muted:#93aabb;--accent:#a98ef0;--accent-ink:#1b1036;--accent-soft:#2c2350;--accent-deep:#cdbdf7;
  --good:#4fc88b;--good-soft:#123528;--bad:#f08080;--bad-soft:#3a1c1f;--warn:#e6b45c;--warn-soft:#382b13;
  --paper:#26211f;--paper-line:#6d4b40;--paper-ink:#f0b9a5;--pencil:#f3ede6;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);line-height:1.35;text-wrap:balance;margin:0}
h2{font-size:21px}h3{font-size:18px}
p{margin:0}
.app{max-width:600px;margin:0 auto;min-height:100%;padding-bottom:calc(108px + env(safe-area-inset-bottom,0px))}
body.exam-mode .app{padding-bottom:24px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:grid;gap:14px;padding-block:14px 8px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.bar h2{flex:1;min-width:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:20px;flex:none}

/* Hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:0 0 24px 24px;padding-block:22px 18px;display:grid;gap:14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero h1{font-size:38px;letter-spacing:0}
.hero .sub{opacity:.9;font-size:15px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(255,255,255,.16);padding:5px;border-radius:14px}
.seg button{border:0;background:transparent;color:inherit;border-radius:10px;padding:9px 4px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-deep);font-weight:700}
.countdown{background:rgba(255,255,255,.18);border-radius:12px;padding:6px 12px;text-align:center;font-size:13px;flex:none}
.countdown b{display:block;font-family:var(--font-display);font-size:25px;line-height:1.2}

/* Cards & common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:grid;gap:10px;min-width:0}
.card>*,.screen>*,.lesson-body>*,.msg>*{min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.row>*{min-width:0}
.muted{color:var(--muted);font-size:15px}
.label{font-size:13px;color:var(--muted);letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent-deep);font-size:13px;font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.btn{border:0;border-radius:13px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center}
.btn.soft{background:var(--accent-soft);color:var(--accent-deep)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1 1 140px}
.note{background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:15px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:4px}
.empty{color:var(--muted);text-align:center;padding:14px 4px;font-size:16px}

/* Home */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:13px;color:var(--muted)}
.stat b{display:block;font-family:var(--font-display);font-size:25px;color:var(--fg);font-variant-numeric:tabular-nums}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:right;display:grid;gap:4px;box-shadow:var(--shadow)}
.tool .glyph{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);font-family:var(--font-display);font-weight:700;font-size:19px}
.tool b{font-size:17px}.tool span{font-size:13px;color:var(--muted)}
.tool.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tool.primary span{color:inherit;opacity:.85}.tool.primary .glyph{background:rgba(255,255,255,.2);color:inherit}
.subj{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;width:100%;text-align:right}
.glyph{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:20px;color:#fff;flex:none}
.subj .meta{flex:1;min-width:0}.subj .meta b{display:block}
.list{display:grid;gap:8px}

/* Sessions */
.session{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.session:first-child{border-top:0}
.session .time{font-family:var(--font-display);font-variant-numeric:tabular-nums;direction:ltr;min-width:52px;font-weight:700;color:var(--accent-deep)}
.session .what{flex:1;min-width:0}
.session.done .what b{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:transparent;font-weight:700}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 2px;font-size:13px;text-align:center;line-height:1.4}
.day b{display:block;font-size:15px}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day.today:not([aria-pressed="true"]){border-color:var(--accent);color:var(--accent-deep)}
.day small{display:block;font-size:12px;opacity:.75}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-grid .full{grid-column:1/-1}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.input,select.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;font-size:17px;color:var(--fg);min-width:0}

/* Exam setup */
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:500}
.choice[aria-pressed="true"]{background:var(--accent-soft);border:2px solid var(--accent);color:var(--accent-deep);font-weight:700;padding:8px 13px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:right;display:grid;gap:4px}
.mode[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:11px}
.mode b{font-size:17px}.mode span{font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{right:23px}

/* Exam */
.exam-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.timer{font-family:var(--font-display);font-variant-numeric:tabular-nums;direction:ltr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:700;font-size:19px}
.timer.low{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .2s}
.qgrid{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.qgrid::-webkit-scrollbar{display:none}
.qdot{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-variant-numeric:tabular-nums;position:relative}
.qdot.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:700}
.qdot.current{outline:2px solid var(--accent);outline-offset:1px}
.qdot.flagged::after{content:"";position:absolute;top:-3px;left:-3px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.qtext{font-size:20px;font-weight:700;line-height:1.7}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:13px 12px;font-size:18px}
.opt .k{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;flex:none;font-size:16px}
.opt[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:12px 11px}
.opt[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flag{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;font-size:15px}
.flag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
.exam-foot{display:flex;gap:8px}.exam-foot .btn{flex:1}

/* Bubble sheet */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:8px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);font-weight:700;box-shadow:var(--shadow)}
.booklet-q{display:grid;gap:6px;padding-block:12px;border-top:1px dashed var(--line)}
.booklet-q:first-child{border-top:0}
.booklet-q ol{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.booklet-q li{display:flex;gap:8px}
.booklet-q li .k{font-weight:700;color:var(--muted);min-width:20px}
.sheet{background:var(--paper);border:2px solid var(--paper-line);border-radius:6px;padding:14px 12px;display:grid;gap:12px;color:var(--fg)}
.sheet-head{border-bottom:2px solid var(--paper-line);padding-bottom:10px;display:grid;gap:8px}
.sheet-head h3{color:var(--paper-ink);font-size:17px;text-align:center}
.sheet-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--paper-ink)}
.sheet-fields .box{border:1px solid var(--paper-line);border-radius:4px;padding:6px 8px;background:transparent;min-width:0;width:100%;color:var(--fg);font-size:16px;font-variant-numeric:tabular-nums}
.sheet-rules{font-size:13px;color:var(--paper-ink);line-height:1.6}
.bubble-cols{display:grid;grid-template-columns:1fr;gap:0 18px}
@media (min-width:520px){.bubble-cols{grid-template-columns:1fr 1fr}}
.brow{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid color-mix(in srgb,var(--paper-line) 45%,transparent)}
.brow .n{width:26px;font-weight:700;color:var(--paper-ink);font-variant-numeric:tabular-nums;text-align:center;font-size:16px}
.brow .bubbles{display:flex;gap:8px;flex:1}
.bub{width:34px;height:34px;border-radius:50%;border:1.6px solid var(--paper-ink);background:transparent;color:var(--paper-ink);font-size:15px;font-weight:700;display:grid;place-items:center;padding:0}
.bub.on{background:var(--pencil);color:var(--paper);border-color:var(--pencil)}
.brow.invalid{background:var(--bad-soft)}
.brow .flagmini{font-size:12px;color:var(--bad);font-weight:700}

/* Result */
.ring{width:150px;height:150px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.2}
.ring .center b{font-family:var(--font-display);font-size:38px;font-variant-numeric:tabular-nums;display:block}
.verdict{text-align:center;display:grid;gap:4px}
.verdict .grade{font-family:var(--font-display);font-size:25px}
.meta4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.meta4 div{background:var(--surface-2);border-radius:11px;padding:8px 2px;text-align:center;font-size:12px;color:var(--muted)}
.meta4 b{display:block;font-size:21px;color:var(--fg);font-family:var(--font-display);font-variant-numeric:tabular-nums}
.meta4 .g b{color:var(--good)}.meta4 .r b{color:var(--bad)}
.rv{border-inline-start:4px solid var(--line)}
.rv.ok{border-inline-start-color:var(--good)}.rv.no{border-inline-start-color:var(--bad)}.rv.skip{border-inline-start-color:var(--warn)}
.ans{font-size:16px}.ans.right{color:var(--good)}.ans.wrong{color:var(--bad)}
.expl{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:16px}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:8px;font-size:15px}
.barrow .track{height:10px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.barrow .track span{display:block;height:100%;border-radius:9px;background:var(--accent)}
.qfig{margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);display:flex;justify-content:center}.qfig svg{height:auto}.lesson-u summary{gap:8px}.lesson-u .lesson-body{margin:10px 0}.essay-box{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--fg);font:inherit;resize:vertical;margin-bottom:10px}.model{border-inline-start:4px solid var(--good);background:var(--good-soft);border-radius:10px;padding:10px 12px;margin:10px 0}
.weak-row{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}.weak-row:first-of-type{border-top:0}.weak-row .row{align-items:flex-start;gap:8px}.weak-row .row>span:first-child{min-width:0}.weak-row .pill{flex-shrink:0}.bank-q{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line);font-size:16px}details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
.barrow .v{font-variant-numeric:tabular-nums;text-align:left;direction:ltr;font-weight:700}

/* Lessons */
.lesson{display:grid;gap:10px}
.lesson summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;font-weight:700}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary .num{width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-size:15px;flex:none}
.lesson summary .done{margin-inline-start:auto}
.lesson[open] summary{margin-bottom:8px}
.lesson-body{display:grid;gap:10px}
.lesson h4{margin:0;font-size:16px;color:var(--accent-deep)}
.formula{direction:ltr;text-align:center;background:var(--surface-2);color:var(--fg);border-radius:11px;padding:10px 12px;overflow-x:auto;overflow-y:hidden}
/* chemical equations stay as upright text */
.formula.chem{font-family:var(--font-body);font-size:19px;font-weight:500;color:var(--accent-deep)}
math{font-family:'STIX Two Math','Cambria Math','Latin Modern Math',math,'Times New Roman',serif;font-weight:400;direction:ltr}
.formula math{font-size:1.3em;margin:0}
.opt math,.booklet-q math,.ans math,p math,li math{font-size:1.15em}
.msg.me math{color:inherit}
.practice{background:var(--surface-2);border-radius:13px;padding:12px;display:grid;gap:8px}
.popt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:right;width:100%}
.popt.ok{background:var(--good-soft);border:2px solid var(--good);color:var(--good);font-weight:700}
.popt.no{background:var(--bad-soft);border:2px solid var(--bad);color:var(--bad)}
.fb{font-size:16px;display:grid;gap:6px}

/* Tutor */
.tutor{display:grid;gap:10px}
.chat{display:grid;gap:10px}
.msg{max-width:88%;border-radius:16px;padding:10px 13px;display:grid;gap:7px;font-size:17px;min-width:0;overflow-wrap:anywhere}
.msg.me{justify-self:start;background:var(--accent);color:var(--accent-ink);border-end-start-radius:4px}
.msg.bot{justify-self:end;background:var(--surface);border:1px solid var(--line);border-end-end-radius:4px}
.msg .formula{font-size:16px}
.msg ul{margin:0;padding-inline-start:18px}
.msg details{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.msg .src{font-size:13px;color:var(--muted)}
.inline-math{direction:ltr;unicode-bidi:isolate;font-weight:600}
.thinking{color:var(--muted);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:700}
.composer{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;max-height:130px;font-size:18px;line-height:1.5}

const LESSONS={"arabic": ["دروس الوحدة: استماع «آداب التعامل مع الوالدين»، وقراءة «أغلى من الذهب» (البطل محمد رشوان وأخلاق اللعب النظيف)، وقراءة «الصداقة» للدكتور شوقي ضيف، ونص شعري «تحية للشباب» لأمير الشعراء أحمد شوقي.\n- أحمد شوقي: مؤسس المدرسة الكلاسيكية الجديدة ورائد المسرح الشعري العربي.\n- من المفردات: السياج: السور أو الحائط • تتجلى: تظهر (ضدها تختفي) • الدنايا: النقائص (ضدها الفضائل) • كنف: حفظ ورعاية • الخلصاء: الأصدقاء المخلصون • حصيفًا: متعقلًا (ضدها طائشًا) • يسعفك: يغيثك (ضدها يتخلى عنك) • باشًّا: متهلل الوجه • مجيدًا: عظيمًا (ضدها حقيرًا).\n- اسم الفاعل: اسم مشتق يدل على من قام بالفعل.\n  من الثلاثي على وزن «فاعِل»: كتب ← كاتب، قال ← قائل، سعى ← ساعٍ.\n  من غير الثلاثي: نأتي بالمضارع ونبدل حرف المضارعة ميمًا مضمومة ونكسر ما قبل الآخر: أكرم ← مُكرِم، استخرج ← مُستخرِج.\n- اسم المفعول: اسم مشتق يدل على من وقع عليه الفعل.\n  من الثلاثي على وزن «مفعول»: كتب ← مكتوب، قال ← مَقول، باع ← مَبيع، دعا ← مدعوّ، رمى ← مرميّ.\n  من غير الثلاثي: كاسم الفاعل مع فتح ما قبل الآخر: أكرم ← مُكرَم، استخرج ← مُستخرَج.\n- الألف اللينة: في الاسم والفعل الثلاثي تُكتب قائمة إن كان أصلها واوًا (عصا، دعا، علا) ومقصورة إن كان أصلها ياءً (فتى، رمى، بنى، مشى).\n  فوق الثلاثي تُكتب مقصورة (مستشفى، استدعى، أعطى) إلا إذا سبقتها ياء فتُكتب قائمة (دنيا، هدايا، أحيا).\n  في الأسماء الأعجمية قائمة (أمريكا، فرنسا) إلا: موسى، عيسى، كسرى، بُخارى، متى.\n  في الحروف قائمة (لا، ما، يا) إلا: إلى، على، بلى، حتى.", "دروس الوحدة: استماع «ثمرة القراءة»، وقراءة «أفضل النعم» (أهمية العقل والتفكير)، وقراءة «خير جليس» للدكتور أحمد زكي، ونص شعري «تاج الفضائل» للإمام علي بن أبي طالب.\n- «خيرُ جليسٍ في الزمان كتابُ» من قول المتنبي.\n- من المفردات: مآربه: حاجاته وغاياته • يقاربه: يشابهه في الفضل • أمسّها: أقربها • التفريج: إزالة الهم.\n- صيغ المبالغة: أسماء تدل على كثرة حدوث الفعل، وتُصاغ من الثلاثي على خمسة أوزان: فعّال (غفّار)، مِفعال (مِقدام)، فَعول (صبور)، فَعيل (سميع)، فَعِل (حَذِر).\n- اسم المكان: يدل على مكان حدوث الفعل.\n  من الثلاثي على «مَفعَل» إذا كان المضارع مضموم العين أو مفتوحها أو معتل الآخر: ملعَب، مكتَب، مرمى.\n  وعلى «مَفعِل» إذا كان المضارع مكسور العين صحيح الآخر أو كان الفعل مثالًا: مجلِس، موقِف، موعِد.\n  ومن غير الثلاثي على وزن اسم المفعول: مُستشفى، مُلتقى، مُنتزَه.\n- الهمزة في أول الكلمة: همزة القطع تُنطق دائمًا وتُكتب (أكرم، إكرام، أنا)، وهمزة الوصل تُنطق في أول الكلام فقط ولا تُكتب.\n  مواضع همزة الوصل: أمر الثلاثي (اكتبْ)، وماضي الخماسي والسداسي وأمرهما ومصدرهما (انطلق، انطلاق، استخرج، استخراج)، والأسماء: ابن، ابنة، اسم، امرؤ، امرأة، اثنان، اثنتان، و«ال».\n- الهمزة المتوسطة: تُكتب على حرف يناسب أقوى الحركتين: حركتها وحركة ما قبلها؛ وترتيب القوة: الكسرة (ئ) ثم الضمة (ؤ) ثم الفتحة (أ) ثم السكون: سُئِل، مُؤْمن، سَأَل، بِئْر.", "دروس الوحدة: استماع «بناء المستقبل في عصر الآلة»، وقراءة «حرفتك بين يديك» (أهمية التعليم الفني)، وقراءة «مستقبل مصر في الزراعة»، ونص شعري «اصنع بيديك مجدك» لمعروف الرصافي.\n- من المفردات: وليدة: ناتجة عن • ثمرة: نتيجة (جمعها ثمرات) • السحب الجائر: الاستهلاك الزائد عن الحد • المقنن: المضبوط المدروس • النماء: النمو والازدهار • طريف: حديث جديد (ضدها تليد: قديم موروث) • المقاصد: الأهداف.\n- فكرة نص الرصافي: لا يكفي الافتخار بمجد الآباء، بل يصنع الإنسان مجده بعمله في الحاضر.\n- اسم الزمان: يدل على زمن حدوث الفعل، ويُصاغ بأوزان اسم المكان نفسها (مَفعَل، مَفعِل، وزن اسم المفعول من غير الثلاثي)، ويُفرَّق بينهما بالسياق: «موعِد السفر الفجر» زمان، و«موقِف السيارات قريب» مكان.\n- اسم الآلة: اسم يدل على الأداة التي يتم بها الفعل، ومن أوزانه القياسية: مِفعَل (مِبرَد)، مِفعال (مِفتاح)، مِفعَلة (مِكنَسة)، فعّالة (ثلّاجة، غسّالة). ومنه جامد غير مشتق مثل: سكين، قلم.\n- الهمزة المتطرفة: تُكتب على حرف يناسب حركة ما قبلها: قرأَ، تباطُؤ، شاطِئ؛ وتُكتب على السطر إذا سبقها ساكن: جُزْء، دِفْء، سماء، ضوء."], "english": ["Vocabulary: identity, personality, values, background, beliefs, character, confidence, strength, weakness, curious, self-respect, self-discovery, unique, popular, honest.\n- background: where someone comes from • identity: who a person is • self-discovery: learning more about who you are • value: to have a high opinion of something.\nGrammar: Present perfect (active): have / has + past participle.\nExample: I have studied English since I was six.\nPresent perfect (passive): have / has + been + past participle.\nExample: The museum has been visited by many tourists.\nUse \"since\" with a point in time (since 2020) and \"for\" with a period of time (for three years).\nCommon words: just, already, yet, ever, never.\nStory: \"Who Am I Beyond My Looks\" (Ahmed from Giza), \"The Mirror Moment\" (Nour and her portraits), and The School Garden Project, chapter one (Zeina).", "Vocabulary: communicate, communication, connection, misunderstanding, bond, supportive, respectful, resolve, siblings, distant, awkward, frustrated, gesture, reconnect, meaningful, face-to-face.\n- misunderstanding: failure to understand correctly • bond: a strong connection between people • siblings: brothers and sisters • awkward: uncomfortable or strange • gesture: a sign or action that shows feeling • frustrated: upset because of difficulty.\nGrammar: The third conditional talks about unreal situations in the past.\nForm: If + past perfect (had + past participle), would have + past participle.\nExample: If we had communicated better, we wouldn't have argued.\nTexts: \"Stay Connected\", \"The Silent Dinner\" (Omar's family), and chapter two of the garden story (Zeina's proposal to the student council).", "Vocabulary: Artificial Intelligence (AI), robot, advanced, limits, tasks, emotions, behavior, humans, innovation, compose, creative, customize, instantly, confused, notice, initiative, donations, quit, climate.\n- advanced: very modern or developed • limit: the point where something stops • customize: change something to make it the way you want • instantly: without any delay.\nA robot is a machine that can move and do tasks; AI is the \"brain\" that lets it learn and make decisions.\nGrammar: Future simple active: will + base verb (Father will fix his car tomorrow).\nFuture simple passive: will + be + past participle.\nExample: The test will be corrected by the teacher.", "Vocabulary: screen time, entertainment, expert, balance, physical, useful, smart, focused, modern, distraction, scrolling, reduce, waste.\n- physical: related to the body • expert: a person who knows a lot about something • balance: to keep things in the right amount • distraction: something that takes attention away.\nGrammar: Modal verbs: must (obligation), mustn't (prohibition), can / could (permission or ability), should (advice).\nExamples: Students must come to school on time. You mustn't make noise in the library. You should take breaks from the screen.\nConnectors: although, however, on the other hand, because, so.\nExample: Although it was raining, we went outside.", "Vocabulary: designer, problem, solution, prototype, test, feedback, brainstorm, define, challenge, creativity, stylish, schedule, practical, sprint, ideation, point of view.\n- prototype: a simple model of a design • creativity: the ability to make new ideas • stylish: attractive in a fashionable way • practical: effective or suitable.\nDesign thinking steps: understand the users (empathize), define the problem, brainstorm ideas, build a prototype, then test and improve.\nGrammar: Sequence adverbs: first, then, next, after that, finally.\nImperatives: positive (Brainstorm many ideas.) and negative (Don't judge ideas during brainstorming.).", "Vocabulary: moral, various, empathy, aware, spark, critically, conflict, respond, ambition, courage, symbol, point of view.\n- moral: related to what is right or wrong • critically: in a careful thoughtful way • spark: to start or cause something • empathy: the ability to understand and share feelings • ambition: a strong desire to achieve something big.\nStory elements: setting (where and when), characters, conflict (the problem), climax, solution (how the problem ends).\nTypes: fiction (imaginary), non-fiction (true), folk stories (traditional).\nGrammar: Reported speech: tenses move one step back and pronouns change.\nExamples: Sara said, \"I will visit my grandmother tomorrow.\" → Sara said (that) she would visit her grandmother the next day.\nUse \"told\" with an object: Ali told Omar that stories could teach him a lot."], "math": ["الدرس 1-1 قوى القوى، والدرس 1-2 المعادلات الأسية.\n- قانون قوة القوة: `(a^m)^n = a^(mn)`\n- قوة حاصل الضرب: `(ab)ⁿ = aⁿ bⁿ`\n- قوة خارج القسمة: `(a / b)ⁿ = aⁿ / bⁿ` حيث b ≠ 0\n- `a⁰ = 1` و `a⁻ⁿ = 1 / aⁿ` حيث a ≠ 0\n- المعادلة الأسية: المجهول في الأس.\n- لحلها نكتب الطرفين بأساس واحد ثم نساوي الأسس: إذا كان `a^x = a^y` فإن `x = y` حيث a ≠ 0 و a ≠ 1 و a ≠ −1.\nمثال: `2ˣ⁺¹ = 8` ⇐ `2ˣ⁺¹ = 2³` ⇐ `x + 1 = 3` ⇐ `x = 2`", "الدروس: الدالة التربيعية، أصفار دوال كثيرات الحدود، دوال الكسور الجبرية النسبية، المجال المشترك وتساوي الكسور، العمليات على الكسور الجبرية.\n- الدالة التربيعية: `f(x) = ax² + bx + c` حيث a ≠ 0، ومنحناها قطع مكافئ.\n- إذا كان a > 0 فتحة المنحنى لأعلى وللدالة قيمة صغرى، وإذا كان a < 0 فتحته لأسفل وللدالة قيمة عظمى.\n- رأس المنحنى عند `x = −b / (2a)`، ومحور التماثل هو المستقيم الرأسي المار بالرأس.\n- أصفار الدالة: قيم x التي تجعل `f(x) = 0`، وهي الإحداثيات السينية لنقط تقاطع المنحنى مع محور x.\n- مجال دالة الكسر الجبري = R − مجموعة أصفار المقام.\n- المجال المشترك لكسرين = R − (أصفار مقامي الكسرين معًا).\n- يتساوى كسران جبريان إذا كان لهما المجال نفسه وتساويا بعد الاختزال لكل x في هذا المجال.\n- عند الجمع أو الطرح أو الضرب: المجال = R − أصفار المقامين.\n- عند القسمة: المجال = R − أصفار المقامين وأصفار بسط المقسوم عليه.", "الدروس: تشابه المضلعات، تشابه المثلثات، التمدد، النسب المثلثية للزاوية الحادة، النسب المثلثية لبعض الزوايا الخاصة، ميل المستقيمين المتوازيين والمتعامدين، معادلة الخط المستقيم.\n- يتشابه مضلعان إذا تساوت زواياهما المتناظرة وتناسبت أطوال أضلاعهما المتناظرة.\n- يتشابه مثلثان إذا تطابقت زاويتان من أحدهما مع نظيرتيهما في الآخر.\n- نسبة محيطي مضلعين متشابهين = نسبة التشابه.\n- التمدد بمعامل k ومركزه نقطة الأصل: `(x, y) → (kx, ky)`؛ إذا كان |k| > 1 فهو تكبير، وإذا كان |k| < 1 فهو تصغير.\n- في المثلث القائم: جا الزاوية (sin) = المقابل ÷ الوتر، وجتا الزاوية (cos) = المجاور ÷ الوتر، وظا الزاوية (tan) = المقابل ÷ المجاور.\n- قيم الزوايا الخاصة:\n`sin 30° = cos 60° = 1 / 2`\n`sin 60° = cos 30° = √3 / 2`\n`tan 30° = √3 / 3`\n`tan 45° = 1`\n`tan 60° = √3`\n- الميل: `m = (y₂ − y₁) / (x₂ − x₁) = tan θ`\n- المستقيمان المتوازيان ميلاهما متساويان، والمتعامدان حاصل ضرب ميليهما = −1.\n- معادلة المستقيم بمعلومية الميل والمقطع الصادي: `y = mx + c`\n- ميل المستقيم `ax + by + c = 0` يساوي `−a / b`", "الدرس 4-1 مقاييس التشتت.\n- التشتت: مدى تباعد القيم عن بعضها أو عن وسطها الحسابي.\n- المدى = أكبر قيمة − أصغر قيمة، وهو أبسط مقاييس التشتت.\n- المدى الربيعي = الربيع الأعلى − الربيع الأدنى: `Q₃ − Q₁`\n- الانحراف المعياري أدق مقاييس التشتت وأكثرها استخدامًا:\n`σ = √( Σ (x − x̄)² / n )`\n- كلما صغر الانحراف المعياري كانت القيم أكثر تجانسًا (أقل تشتتًا)، وإذا كانت جميع القيم متساوية فالانحراف المعياري = صفر."], "science": ["الدروس: أنواع التفاعلات الكيميائية، تفاعلات الاحتراق والتلوث البيئي، التدخين ومخاطره.\n- الاتحاد المباشر: اتحاد عنصرين أو أكثر لتكوين مركب، مثل احتراق الماغنسيوم:\n2Mg + O₂ → 2MgO\n- الانحلال الحراري: تفكك مركب بالحرارة، مثل:\nCaCO₃ → CaO + CO₂\n- الإحلال البسيط: يحل عنصر نشط محل عنصر أقل نشاطًا، مثل:\nZn + 2HCl → ZnCl₂ + H₂\n- ترتيب بعض الفلزات حسب النشاط: Na > Mg > Al > Zn > Fe > H > Cu > Ag، والنحاس لا يتفاعل مع حمض الهيدروكلوريك المخفف.\n- الإحلال المزدوج: تبادل أيونات مركبين، ومنه التعادل (حمض + قلوي ← ملح + ماء) والترسيب، مثل:\nNaCl + AgNO₃ → AgCl + NaNO₃ (راسب أبيض من كلوريد الفضة)\n- دليل اليونيفرسال: أحمر مع الحمض القوي، أخضر عند التعادل، بنفسجي مع القلوي القوي.\n- الأكسدة: فقد إلكترونات، والاختزال: اكتساب إلكترونات. العامل المختزل يتأكسد، والعامل المؤكسد يُختزل.\n- مثلث الاحتراق: وقود + أكسجين + طاقة حرارية.\n- الاحتراق التام لهب أزرق وينتج CO₂ وبخار ماء، وغير التام لهب أصفر أو برتقالي وينتج أول أكسيد الكربون والسناج.\nCH₄ + 2O₂ → CO₂ + 2H₂O\n- التدخين: النيكوتين يسبب الإدمان، وأول أكسيد الكربون يقلل قدرة الدم على نقل الأكسجين، والقطران يسبب النفاخ الرئوي. التدخين السلبي: استنشاق غير المدخن لدخان المدخنين.", "الدروس: التيار الكهربي، الدوائر الكهربية، القوى الكهربية والمغناطيسية.\n- شدة التيار = كمية الشحنة ÷ الزمن:\nI = Q / t (الوحدة: أمبير)\n- فرق الجهد = الشغل ÷ الشحنة:\nV = W / Q (الوحدة: فولت = جول / كولوم)\n- قانون أوم:\nV = I × R (المقاومة بالأوم Ω)\n- الأميتر يوصل على التوالي، والفولتميتر على التوازي.\n- تزداد مقاومة السلك بزيادة طوله، وتقل بزيادة مساحة مقطعه، وتعتمد على نوع مادته.\n- التوصيل على التوالي: التيار ثابت والمقاومة الكلية:\nR = R₁ + R₂ + R₃\n- التوصيل على التوازي: فرق الجهد ثابت، ولعدد n من المقاومات المتماثلة:\nR = r / n\n- القدرة الكهربية:\nP = W / t = V × I (الوحدة: وات)\n- الطاقة المستهلكة بالكيلووات ساعة = القدرة بالكيلووات × الزمن بالساعات.\n- مصابيح الليد LED أقل استهلاكًا للطاقة من مصابيح الفلورسنت المدمجة CFL.\n- مرور تيار في سلك يولّد مجالًا مغناطيسيًا حوله.\n- المغناطيس الكهربي: سلك نحاسي معزول ملفوف حول قلب من الحديد المطاوع، وتزداد قوته بزيادة عدد اللفات وشدة التيار.\n- المحرك الكهربي يحول الطاقة الكهربية إلى حركية، والمولد الكهربي يحول الطاقة الحركية إلى كهربية.", "الدروس: الوراثة وتنوع الصفات، الانتخاب الطبيعي والانتخاب الصناعي.\n- الجين: جزء من الحمض النووي DNA يحمل المعلومات الوراثية المسئولة عن صفة.\n- الأليل: أحد صور الجين؛ السائد يُرمز له بحرف كبير (B) والمتنحي بحرف صغير (b).\n- الطراز الجيني: التركيب الوراثي للفرد (BB أو Bb أو bb)، والطراز المظهري: الصفة الظاهرة.\n- لا تظهر الصفة المتنحية إلا إذا كان الفرد نقيًا لها (bb).\n- مربع بانيت: أداة للتنبؤ بالطرز الجينية والمظهرية للأبناء.\n- تهجين فردين هجينين Bb × Bb ينتج نسبة مظهرية 3 : 1، وفي صفتين معًا 9 : 3 : 3 : 1.\n- حامل المرض الوراثي: يحمل أليلًا متنحيًا للمرض مع أليل سليم، فيبدو سليمًا لكنه يورثه لأبنائه.\n- الجماعة الحيوية: أفراد من النوع نفسه يعيشون في المكان والزمان نفسيهما ويتكاثرون فيما بينهم.\n- السعة التحملية: أقصى عدد من أفراد النوع تستطيع البيئة دعمه باستمرار.\n- العوامل البيئية المؤثرة في نمو الجماعات: الغذاء والماء والحرارة والأمراض والمفترسات والمساحة.\n- الانتخاب الطبيعي: بقاء الأفراد الأكثر تكيفًا وانتقال صفاتهم عبر الأجيال؛ وهو عملية تراكمية.\n- الانتخاب الصناعي: يختار الإنسان أفرادًا ذوي صفات مرغوبة لتحسين الإنتاج.\n- الأشنات (تعايش فطر وطحلب) مؤشر حيوي على نقاء الهواء.", "الدروس: السجل الحفري، الأزمنة الجيولوجية.\n- الحفريات: بقايا أو آثار كائنات عاشت في العصور الجيولوجية القديمة وحُفظت في الصخور.\n- من أنواعها: حفريات الأثر (آثار أقدام، جحور، مسارات)، والطابع (انطباع الشكل الخارجي)، والقالب (امتلاء التجويف بالمعادن أو الرواسب).\n- الانقراض الجماعي منذ نحو 66 مليون سنة أنهى أكثر من 75٪ من الأنواع، ومنها معظم الديناصورات.\n- التراكيب المتماثلة: تركيب متشابه ووظيفة مختلفة (ذراع الإنسان وزعنفة الحوت وجناح الخفاش) وتدل على أصل مشترك.\n- التراكيب المتناظرة: وظيفة متشابهة وتركيب مختلف (جناح الفراشة وجناح الطائر) وتدل على التكيف مع بيئات متشابهة.\n- مقياس الزمن الجيولوجي: تقسيم تاريخ الأرض إلى دهور وحقب وعصور وأزمنة؛ وحقبة الحياة الحديثة من 66 مليون سنة حتى الآن.\n- العمر النسبي: تحديد الأقدم والأحدث دون تحديد العمر بالسنوات، ويعتمد على قانون التعاقب الطبقي: الطبقات السفلى أقدم من العليا ما لم تتعرض لاضطراب.\n- الحفريات المرشدة: واسعة الانتشار جغرافيًا، عاشت فترة زمنية قصيرة، وتُستخدم لمضاهاة الطبقات.\n- العمر المطلق: تحديد عمر الصخر بالسنوات باستخدام النظائر المشعة وفترة عمر النصف."], "social": ["قارات العالم الجديد: أمريكا الشمالية وأمريكا الجنوبية وأستراليا.\n- أمريكا الشمالية ثالث قارات العالم مساحة بعد آسيا وإفريقيا، ثم أمريكا الجنوبية، وأستراليا أصغرها.\n- أستراليا جزيرة كبيرة في نصفي الكرة الجنوبي والشرقي؛ يحدها بحرا آرافورا وتيمور شمالًا، والمحيط الهندي جنوبًا وغربًا، والمحيط الهادي شرقًا.\n- من أهمية الموقع: قناة بنما ممر مهم للتجارة العالمية، وتنوع النظم البيئية، والمعادن (اليورانيوم والحديد في أستراليا)، وظهور حضارات المايا والإنكا.\n- مظاهر السطح: جبال روكي والأبلاش وهضبة لبرادور والسهول الوسطى ونهر المسيسبي (يصب في خليج المكسيك) في أمريكا الشمالية؛ وجبال الإنديز (أطول سلسلة جبلية في العالم) وهضبة البرازيل (أكبر هضاب القارة) في أمريكا الجنوبية؛ وهضبة غرب أستراليا (نحو ثلثي القارة) وجبال الحاجز الكبير ونهرا مري ودارلنج في أستراليا.\n- سهول المحيط الهادي في أمريكا الجنوبية ضيقة لاقتراب الإنديز من الساحل.\n- حضارة المايا: في أقصى جنوب أمريكا الشمالية، مدن مستقلة، الملك يجمع السلطتين السياسية والدينية، اهتمت بعلم الفلك والكتابة التصويرية.\n- حضارة الإنكا: في غرب أمريكا الجنوبية، حكم مركزي قوي وراثي، برعت في العمارة (ماتشو بيتشو في بيرو) وبناء الطرق والجسور، وعرفت التحنيط.\n- دوافع الكشوف: البحث عن طرق تجارية جديدة إلى الهند وشرق آسيا تتجنب رسوم العثمانيين والمماليك، والبحث عن الذهب والفضة والتوابل والحرير.\n- كولومبوس (إيطالي موّلته إسبانيا) وصل إلى جزر البهاما واعتقد أنها آسيا، وأميريجو فسبوتشي أدرك أنها قارة جديدة، وجيمس كوك وصل إلى الساحل الشرقي لأستراليا عام 1770م.\n- من النتائج: تحول المحيط الأطلنطي إلى طريق رئيسي للتجارة، وتدفق الذهب والفضة على أوروبا، وأدلة عملية على كروية الأرض؛ ومن آثارها السلبية إبادة السكان الأصليين وانتشار الأوبئة وتجارة الرقيق.", "بعد خروج الحملة الفرنسية (1801م) تصارعت ثلاث قوى على حكم مصر: العثمانيون والمماليك والإنجليز، وانسحب الإنجليز بموجب صلح أميان.\n- اجتمع المشايخ والعلماء بقيادة السيد عمر مكرم (نقيب الأشراف) وعزلوا خورشيد باشا واختاروا «محمد علي» واليًا عام 1805م.\n- تحديات بعد توليه: المماليك، وفرمان نقله إلى ولاية سالونيك عام 1806م، وحملة فريزر عام 1807م التي فشلت في رشيد والحماد وانسحبت.\n- الإصلاح الداخلي: جيش نظامي من المصريين وبعثات إلى أوروبا، وإلغاء نظام الالتزام، ونظام الاحتكار، وإدخال القطن طويل التيلة، وإنشاء المصانع والقناطر والترع، ومدارس عليا مثل الطب والصيدلة والزراعة.\n- السياسة الخارجية: حروب الوهابيين في شبه الجزيرة العربية واليونان (تحطم الأسطول في نافارين) لصالح السلطان، ثم حرب الشام، فعقدت الدول الأوروبية معاهدة لندن 1840م: حكم وراثي في أسرته مع بقاء مصر ولاية عثمانية تدفع جزية سنوية.\n- خلفاؤه: عباس حلمي الأول (تدهور التعليم وبدأ مد السكة الحديد بين القاهرة والإسكندرية)، ومحمد سعيد (اللائحة السعيدية، وامتياز قناة السويس لدليسبس عام 1854م لمدة 99 سنة من افتتاحها)، والخديو إسماعيل (مجلس شورى النواب 1866م، ودار الأوبرا، ومدرسة السنية للبنات، والترعة الإبراهيمية).\n- أزمة الديون في عهد إسماعيل أدت إلى التدخل الأجنبي: المراقبة الثنائية (مراقب إنجليزي للإيرادات وفرنسي للمصروفات)، ثم لجنة التحقيق العليا، ثم الوزارة المختلطة برئاسة نوبار باشا.", "تتنوع النظم البيئية في قارات العالم الجديد بسبب امتدادها الواسع عبر دوائر العرض وتنوع مظاهر سطحها.\n- نظم الغابات: المدارية المطيرة (أمريكا الجنوبية تضم نحو نصف مساحتها في العالم وأشهرها الأمازون «رئة الأرض»)، والموسمية، وغابات البحر المتوسط (غرب كاليفورنيا ووسط شيلي وجنوب وجنوب غرب أستراليا)، والنفضية (شرق الولايات المتحدة وكندا)، والصنوبرية (لا توجد في أستراليا).\n- نظم الحشائش: السافانا (انتقالية بين الغابات المدارية والصحاري الحارة، وتنتشر في هضبة البرازيل)، والحشائش المعتدلة: الإستبس (خشنة قليلة الأشجار) والبراري (أطول وأكثف)، وحشائش التندرا الباردة.\n- النظم الصحراوية: الصحاري الحارة والمعتدلة، والصحاري الباردة (الجليدية) في شمال أمريكا الشمالية وجرينلاند، وأنتاركتيكا أكثر الصحاري برودة وجفافًا.\n- النظم المائية العذبة: الأنهار والبحيرات والأراضي الرطبة؛ البحيرات العظمى الخمس أكبر نظام لبحيرات المياه العذبة، وسوبيريور أكبر بحيرة عذبة في العالم مساحة، وميتشجن تقع كلها داخل الولايات المتحدة.\n- النظم المالحة: البحرية والشعاب المرجانية (الحاجز المرجاني العظيم بشرق أستراليا أكبرها، وحاجز بليز ثانيها) والمانجروف (عند مصب الأمازون).\n- التغير المناخي: عوامله البشرية انبعاث الغازات الدفيئة (ثاني أكسيد الكربون والميثان) وقطع الغابات والتوسع الحضري، والطبيعية حرائق الغابات والنشاط البركاني.\n- من آثاره: ارتفاع حرارة المحيطات وهجرة الكائنات البحرية، وارتفاع مستوى سطح البحر، وانتشار أمراض مثل الملاريا، والنزوح السكاني.\n- من الجهود الدولية مؤتمرات المناخ مثل COP27 بشرم الشيخ الذي اهتم بقضية «الخسائر والأضرار».", "تولى الخديو توفيق الحكم عام 1879م بعد عزل والده إسماعيل بفرمان عثماني.\n- أحمد عرابي: وُلد بالشرقية وتعلم بالأزهر والتحق بالجيش.\n- أسباب الثورة العرابية: عسكرية (تفضيل عثمان رفقي وزير الحربية للضباط الأتراك)، وسياسية (الاستبداد وزيادة النفوذ الأجنبي)، واقتصادية.\n- أحداثها: حادثة قصر النيل وعزل عثمان رفقي وتعيين محمود سامي البارودي وزيرًا للحربية، ثم مظاهرة عابدين (9 سبتمبر 1881م).\n- المذكرة المشتركة الأولى من بريطانيا وفرنسا كانت خطوة نحو التدخل الأجنبي العلني، واستقال شريف باشا لتمسك مجلس النواب بحق مناقشة الميزانية.\n- رفضت الحكومة المصرية الإنذار البريطاني بتسليم حصون الإسكندرية، فضربها الأسطول البريطاني عام 1882م، وهُزم الجيش المصري في التل الكبير وبدأ الاحتلال.\n- الاحتلال: قلّص الجيش ووضعه تحت إشراف ضباط بريطانيين، وركز على الزراعة (القطن) وأهمل الصناعة.\n- مصطفى كامل (باعث الحركة الوطنية الحديثة): درس الحقوق، أنشأ جريدة اللواء والحزب الوطني، واستغل حادثة دنشواي (1906م) لفضح الاحتلال، واحتج على اتفاقية الحكم الثنائي للسودان (1899م).\n- محمد فريد: تولى رئاسة الحزب الوطني بعد وفاة مصطفى كامل (1908م)، واهتم بتعليم العمال بإنشاء المدارس الليلية."]};

const NOTES={"arabic": [{"t": "دروس الوحدة — قيمٌ تحمي شبابنا", "b": "دروس الوحدة: استماع «آداب التعامل مع الوالدين»، وقراءة «أغلى من الذهب» (البطل محمد رشوان وأخلاق اللعب النظيف)، وقراءة «الصداقة» للدكتور شوقي ضيف، ونص شعري «تحية للشباب» لأمير الشعراء أحمد شوقي."}, {"t": "أحمد شوقي — قيمٌ تحمي شبابنا", "b": "أحمد شوقي: مؤسس المدرسة الكلاسيكية الجديدة ورائد المسرح الشعري العربي."}, {"t": "من المفردات — قيمٌ تحمي شبابنا", "b": "من المفردات: السياج: السور أو الحائط • تتجلى: تظهر (ضدها تختفي) • الدنايا: النقائص (ضدها الفضائل) • كنف: حفظ ورعاية • الخلصاء: الأصدقاء المخلصون • حصيفًا: متعقلًا (ضدها طائشًا) • يسعفك: يغيثك (ضدها يتخلى عنك) • باشًّا: متهلل الوجه • مجيدًا: عظيمًا (ضدها حقيرًا)."}, {"t": "اسم الفاعل — قيمٌ تحمي شبابنا", "b": "اسم الفاعل: اسم مشتق يدل على من قام بالفعل.\n  من الثلاثي على وزن «فاعِل»: كتب ← كاتب، قال ← قائل، سعى ← ساعٍ.\n  من غير الثلاثي: نأتي بالمضارع ونبدل حرف المضارعة ميمًا مضمومة ونكسر ما قبل الآخر: أكرم ← مُكرِم، استخرج ← مُستخرِج."}, {"t": "اسم المفعول — قيمٌ تحمي شبابنا", "b": "اسم المفعول: اسم مشتق يدل على من وقع عليه الفعل.\n  من الثلاثي على وزن «مفعول»: كتب ← مكتوب، قال ← مَقول، باع ← مَبيع، دعا ← مدعوّ، رمى ← مرميّ.\n  من غير الثلاثي: كاسم الفاعل مع فتح ما قبل الآخر: أكرم ← مُكرَم، استخرج ← مُستخرَج."}, {"t": "الألف اللينة — قيمٌ تحمي شبابنا", "b": "الألف اللينة: في الاسم والفعل الثلاثي تُكتب قائمة إن كان أصلها واوًا (عصا، دعا، علا) ومقصورة إن كان أصلها ياءً (فتى، رمى، بنى، مشى).\n  فوق الثلاثي تُكتب مقصورة (مستشفى، استدعى، أعطى) إلا إذا سبقتها ياء فتُكتب قائمة (دنيا، هدايا، أحيا).\n  في الأسماء الأعجمية قائمة (أمريكا، فرنسا) إلا: موسى، عيسى، كسرى، بُخارى، متى.\n  في الحروف قائمة (لا، ما، يا) إلا: إلى، على، بلى، حتى."}, {"t": "دروس الوحدة — نحو تفكيرٍ سليم", "b": "دروس الوحدة: استماع «ثمرة القراءة»، وقراءة «أفضل النعم» (أهمية العقل والتفكير)، وقراءة «خير جليس» للدكتور أحمد زكي، ونص شعري «تاج الفضائل» للإمام علي بن أبي طالب."}, {"t": "نحو تفكيرٍ سليم", "b": "«خيرُ جليسٍ في الزمان كتابُ» من قول المتنبي."}, {"t": "من المفردات — نحو تفكيرٍ سليم", "b": "من المفردات: مآربه: حاجاته وغاياته • يقاربه: يشابهه في الفضل • أمسّها: أقربها • التفريج: إزالة الهم."}, {"t": "صيغ المبالغة — نحو تفكيرٍ سليم", "b": "صيغ المبالغة: أسماء تدل على كثرة حدوث الفعل، وتُصاغ من الثلاثي على خمسة أوزان: فعّال (غفّار)، مِفعال (مِقدام)، فَعول (صبور)، فَعيل (سميع)، فَعِل (حَذِر)."}, {"t": "اسم المكان — نحو تفكيرٍ سليم", "b": "اسم المكان: يدل على مكان حدوث الفعل.\n  من الثلاثي على «مَفعَل» إذا كان المضارع مضموم العين أو مفتوحها أو معتل الآخر: ملعَب، مكتَب، مرمى.\n  وعلى «مَفعِل» إذا كان المضارع مكسور العين صحيح الآخر أو كان الفعل مثالًا: مجلِس، موقِف، موعِد.\n  ومن غير الثلاثي على وزن اسم المفعول: مُستشفى، مُلتقى، مُنتزَه."}, {"t": "الهمزة في أول الكلمة — نحو تفكيرٍ سليم", "b": "الهمزة في أول الكلمة: همزة القطع تُنطق دائمًا وتُكتب (أكرم، إكرام، أنا)، وهمزة الوصل تُنطق في أول الكلام فقط ولا تُكتب.\n  مواضع همزة الوصل: أمر الثلاثي (اكتبْ)، وماضي الخماسي والسداسي وأمرهما ومصدرهما (انطلق، انطلاق، استخرج، استخراج)، والأسماء: ابن، ابنة، اسم، امرؤ، امرأة، اثنان، اثنتان، و«ال»."}, {"t": "الهمزة المتوسطة — نحو تفكيرٍ سليم", "b": "الهمزة المتوسطة: تُكتب على حرف يناسب أقوى الحركتين: حركتها وحركة ما قبلها؛ وترتيب القوة: الكسرة (ئ) ثم الضمة (ؤ) ثم الفتحة (أ) ثم السكون: سُئِل، مُؤْمن، سَأَل، بِئْر."}, {"t": "دروس الوحدة — أنا والمستقبل", "b": "دروس الوحدة: استماع «بناء المستقبل في عصر الآلة»، وقراءة «حرفتك بين يديك» (أهمية التعليم الفني)، وقراءة «مستقبل مصر في الزراعة»، ونص شعري «اصنع بيديك مجدك» لمعروف الرصافي."}, {"t": "من المفردات — أنا والمستقبل", "b": "من المفردات: وليدة: ناتجة عن • ثمرة: نتيجة (جمعها ثمرات) • السحب الجائر: الاستهلاك الزائد عن الحد • المقنن: المضبوط المدروس • النماء: النمو والازدهار • طريف: حديث جديد (ضدها تليد: قديم موروث) • المقاصد: الأهداف."}, {"t": "فكرة نص الرصافي — أنا والمستقبل", "b": "فكرة نص الرصافي: لا يكفي الافتخار بمجد الآباء، بل يصنع الإنسان مجده بعمله في الحاضر."}, {"t": "اسم الزمان — أنا والمستقبل", "b": "اسم الزمان: يدل على زمن حدوث الفعل، ويُصاغ بأوزان اسم المكان نفسها (مَفعَل، مَفعِل، وزن اسم المفعول من غير الثلاثي)، ويُفرَّق بينهما بالسياق: «موعِد السفر الفجر» زمان، و«موقِف السيارات قريب» مكان."}, {"t": "اسم الآلة — أنا والمستقبل", "b": "اسم الآلة: اسم يدل على الأداة التي يتم بها الفعل، ومن أوزانه القياسية: مِفعَل (مِبرَد)، مِفعال (مِفتاح)، مِفعَلة (مِكنَسة)، فعّالة (ثلّاجة، غسّالة). ومنه جامد غير مشتق مثل: سكين، قلم."}, {"t": "الهمزة المتطرفة — أنا والمستقبل", "b": "الهمزة المتطرفة: تُكتب على حرف يناسب حركة ما قبلها: قرأَ، تباطُؤ، شاطِئ؛ وتُكتب على السطر إذا سبقها ساكن: جُزْء، دِفْء، سماء، ضوء."}], "english": [{"t": "Vocabulary — Unit 1: Personal Identity", "b": "Vocabulary: identity, personality, values, background, beliefs, character, confidence, strength, weakness, curious, self-respect, self-discovery, unique, popular, honest."}, {"t": "background — Unit 1: Personal Identity", "b": "background: where someone comes from • identity: who a person is • self-discovery: learning more about who you are • value: to have a high opinion of something."}, {"t": "Grammar — Unit 1: Personal Identity", "b": "Grammar: Present perfect (active): have / has + past participle.\nExample: I have studied English since I was six."}, {"t": "Present perfect (passive) — Unit 1: Personal Identity", "b": "Present perfect (passive): have / has + been + past participle.\nExample: The museum has been visited by many tourists.\nUse \"since\" with a point in time (since 2020) and \"for\" with a period of time (for three years)."}, {"t": "Common words — Unit 1: Personal Identity", "b": "Common words: just, already, yet, ever, never."}, {"t": "Story — Unit 1: Personal Identity", "b": "Story: \"Who Am I Beyond My Looks\" (Ahmed from Giza), \"The Mirror Moment\" (Nour and her portraits), and The School Garden Project, chapter one (Zeina)."}, {"t": "Vocabulary — Unit 2: Communication with Family and Friends", "b": "Vocabulary: communicate, communication, connection, misunderstanding, bond, supportive, respectful, resolve, siblings, distant, awkward, frustrated, gesture, reconnect, meaningful, face-to-face."}, {"t": "misunderstanding — Unit 2: Communication with Family and Friends", "b": "misunderstanding: failure to understand correctly • bond: a strong connection between people • siblings: brothers and sisters • awkward: uncomfortable or strange • gesture: a sign or action that shows feeling • frustrated: upset because of difficulty."}, {"t": "Grammar — Unit 2: Communication with Family and Friends", "b": "Grammar: The third conditional talks about unreal situations in the past.\nForm: If + past perfect (had + past participle), would have + past participle.\nExample: If we had communicated better, we wouldn't have argued."}, {"t": "Texts — Unit 2: Communication with Family and Friends", "b": "Texts: \"Stay Connected\", \"The Silent Dinner\" (Omar's family), and chapter two of the garden story (Zeina's proposal to the student council)."}, {"t": "Vocabulary — Unit 3: Artificial Intelligence", "b": "Vocabulary: Artificial Intelligence (AI), robot, advanced, limits, tasks, emotions, behavior, humans, innovation, compose, creative, customize, instantly, confused, notice, initiative, donations, quit, climate."}, {"t": "advanced — Unit 3: Artificial Intelligence", "b": "advanced: very modern or developed • limit: the point where something stops • customize: change something to make it the way you want • instantly: without any delay.\nA robot is a machine that can move and do tasks; AI is the \"brain\" that lets it learn and make decisions."}, {"t": "Grammar — Unit 3: Artificial Intelligence", "b": "Grammar: Future simple active: will + base verb (Father will fix his car tomorrow)."}, {"t": "Future simple passive — Unit 3: Artificial Intelligence", "b": "Future simple passive: will + be + past participle.\nExample: The test will be corrected by the teacher."}, {"t": "Vocabulary — Unit 4: Screen Time", "b": "Vocabulary: screen time, entertainment, expert, balance, physical, useful, smart, focused, modern, distraction, scrolling, reduce, waste."}, {"t": "physical — Unit 4: Screen Time", "b": "physical: related to the body • expert: a person who knows a lot about something • balance: to keep things in the right amount • distraction: something that takes attention away."}, {"t": "Grammar — Unit 4: Screen Time", "b": "Grammar: Modal verbs: must (obligation), mustn't (prohibition), can / could (permission or ability), should (advice).\nExamples: Students must come to school on time. You mustn't make noise in the library. You should take breaks from the screen."}, {"t": "Connectors — Unit 4: Screen Time", "b": "Connectors: although, however, on the other hand, because, so.\nExample: Although it was raining, we went outside."}, {"t": "Vocabulary — Unit 5: Design Thinking", "b": "Vocabulary: designer, problem, solution, prototype, test, feedback, brainstorm, define, challenge, creativity, stylish, schedule, practical, sprint, ideation, point of view."}, {"t": "prototype — Unit 5: Design Thinking", "b": "prototype: a simple model of a design • creativity: the ability to make new ideas • stylish: attractive in a fashionable way • practical: effective or suitable."}, {"t": "Design thinking steps — Unit 5: Design Thinking", "b": "Design thinking steps: understand the users (empathize), define the problem, brainstorm ideas, build a prototype, then test and improve."}, {"t": "Grammar — Unit 5: Design Thinking", "b": "Grammar: Sequence adverbs: first, then, next, after that, finally."}, {"t": "Imperatives — Unit 5: Design Thinking", "b": "Imperatives: positive (Brainstorm many ideas.) and negative (Don't judge ideas during brainstorming.)."}, {"t": "Vocabulary — Unit 6: Why Do We Like Stories?", "b": "Vocabulary: moral, various, empathy, aware, spark, critically, conflict, respond, ambition, courage, symbol, point of view."}, {"t": "moral — Unit 6: Why Do We Like Stories?", "b": "moral: related to what is right or wrong • critically: in a careful thoughtful way • spark: to start or cause something • empathy: the ability to understand and share feelings • ambition: a strong desire to achieve something big."}, {"t": "Story elements — Unit 6: Why Do We Like Stories?", "b": "Story elements: setting (where and when), characters, conflict (the problem), climax, solution (how the problem ends)."}, {"t": "Types — Unit 6: Why Do We Like Stories?", "b": "Types: fiction (imaginary), non-fiction (true), folk stories (traditional)."}, {"t": "Grammar — Unit 6: Why Do We Like Stories?", "b": "Grammar: Reported speech: tenses move one step back and pronouns change.\nExamples: Sara said, \"I will visit my grandmother tomorrow.\" → Sara said (that) she would visit her grandmother the next day."}, {"t": "Use \"told\" with an object — Unit 6: Why Do We Like Stories?", "b": "Use \"told\" with an object: Ali told Omar that stories could teach him a lot."}], "math": [{"t": "الأعداد والعمليات عليها", "b": "الدرس 1-1 قوى القوى، والدرس 1-2 المعادلات الأسية."}, {"t": "قانون قوة القوة — الأعداد والعمليات عليها", "b": "قانون قوة القوة: `(a^m)^n = a^(mn)`"}, {"t": "قوة حاصل الضرب — الأعداد والعمليات عليها", "b": "قوة حاصل الضرب: `(ab)ⁿ = aⁿ bⁿ`"}, {"t": "قوة خارج القسمة — الأعداد والعمليات عليها", "b": "قوة خارج القسمة: `(a / b)ⁿ = aⁿ / bⁿ` حيث b ≠ 0"}, {"t": "الأعداد والعمليات عليها", "b": "`a⁰ = 1` و `a⁻ⁿ = 1 / aⁿ` حيث a ≠ 0"}, {"t": "المعادلة الأسية — الأعداد والعمليات عليها", "b": "المعادلة الأسية: المجهول في الأس."}, {"t": "الأعداد والعمليات عليها", "b": "لحلها نكتب الطرفين بأساس واحد ثم نساوي الأسس: إذا كان `a^x = a^y` فإن `x = y` حيث a ≠ 0 و a ≠ 1 و a ≠ −1.\nمثال: `2ˣ⁺¹ = 8` ⇐ `2ˣ⁺¹ = 2³` ⇐ `x + 1 = 3` ⇐ `x = 2`"}, {"t": "الدروس — الجبر", "b": "الدروس: الدالة التربيعية، أصفار دوال كثيرات الحدود، دوال الكسور الجبرية النسبية، المجال المشترك وتساوي الكسور، العمليات على الكسور الجبرية."}, {"t": "الدالة التربيعية — الجبر", "b": "الدالة التربيعية: `f(x) = ax² + bx + c` حيث a ≠ 0، ومنحناها قطع مكافئ."}, {"t": "الجبر", "b": "إذا كان a > 0 فتحة المنحنى لأعلى وللدالة قيمة صغرى، وإذا كان a < 0 فتحته لأسفل وللدالة قيمة عظمى."}, {"t": "الجبر", "b": "رأس المنحنى عند `x = −b / (2a)`، ومحور التماثل هو المستقيم الرأسي المار بالرأس."}, {"t": "أصفار الدالة — الجبر", "b": "أصفار الدالة: قيم x التي تجعل `f(x) = 0`، وهي الإحداثيات السينية لنقط تقاطع المنحنى مع محور x."}, {"t": "الجبر", "b": "مجال دالة الكسر الجبري = R − مجموعة أصفار المقام."}, {"t": "الجبر", "b": "المجال المشترك لكسرين = R − (أصفار مقامي الكسرين معًا)."}, {"t": "الجبر", "b": "يتساوى كسران جبريان إذا كان لهما المجال نفسه وتساويا بعد الاختزال لكل x في هذا المجال."}, {"t": "عند الجمع أو الطرح أو الضرب — الجبر", "b": "عند الجمع أو الطرح أو الضرب: المجال = R − أصفار المقامين."}, {"t": "عند القسمة — الجبر", "b": "عند القسمة: المجال = R − أصفار المقامين وأصفار بسط المقسوم عليه."}, {"t": "الدروس — الهندسة", "b": "الدروس: تشابه المضلعات، تشابه المثلثات، التمدد، النسب المثلثية للزاوية الحادة، النسب المثلثية لبعض الزوايا الخاصة، ميل المستقيمين المتوازيين والمتعامدين، معادلة الخط المستقيم."}, {"t": "الهندسة", "b": "يتشابه مضلعان إذا تساوت زواياهما المتناظرة وتناسبت أطوال أضلاعهما المتناظرة."}, {"t": "الهندسة", "b": "يتشابه مثلثان إذا تطابقت زاويتان من أحدهما مع نظيرتيهما في الآخر."}, {"t": "الهندسة", "b": "نسبة محيطي مضلعين متشابهين = نسبة التشابه."}, {"t": "التمدد بمعامل k ومركزه نقطة الأصل — الهندسة", "b": "التمدد بمعامل k ومركزه نقطة الأصل: `(x, y) → (kx, ky)`؛ إذا كان |k| > 1 فهو تكبير، وإذا كان |k| < 1 فهو تصغير."}, {"t": "في المثلث القائم — الهندسة", "b": "في المثلث القائم: جا الزاوية (sin) = المقابل ÷ الوتر، وجتا الزاوية (cos) = المجاور ÷ الوتر، وظا الزاوية (tan) = المقابل ÷ المجاور."}, {"t": "قيم الزوايا الخاصة — الهندسة", "b": "قيم الزوايا الخاصة:\n`sin 30° = cos 60° = 1 / 2`\n`sin 60° = cos 30° = √3 / 2`\n`tan 30° = √3 / 3`\n`tan 45° = 1`\n`tan 60° = √3`"}, {"t": "الميل — الهندسة", "b": "الميل: `m = (y₂ − y₁) / (x₂ − x₁) = tan θ`"}, {"t": "الهندسة", "b": "المستقيمان المتوازيان ميلاهما متساويان، والمتعامدان حاصل ضرب ميليهما = −1."}, {"t": "الهندسة", "b": "معادلة المستقيم بمعلومية الميل والمقطع الصادي: `y = mx + c`"}, {"t": "الهندسة", "b": "ميل المستقيم `ax + by + c = 0` يساوي `−a / b`"}, {"t": "الإحصاء", "b": "الدرس 4-1 مقاييس التشتت."}, {"t": "التشتت — الإحصاء", "b": "التشتت: مدى تباعد القيم عن بعضها أو عن وسطها الحسابي."}, {"t": "الإحصاء", "b": "المدى = أكبر قيمة − أصغر قيمة، وهو أبسط مقاييس التشتت."}, {"t": "الإحصاء", "b": "المدى الربيعي = الربيع الأعلى − الربيع الأدنى: `Q₃ − Q₁`"}, {"t": "الإحصاء", "b": "الانحراف المعياري أدق مقاييس التشتت وأكثرها استخدامًا:\n`σ = √( Σ (x − x̄)² / n )`"}, {"t": "الإحصاء", "b": "كلما صغر الانحراف المعياري كانت القيم أكثر تجانسًا (أقل تشتتًا)، وإذا كانت جميع القيم متساوية فالانحراف المعياري = صفر."}], "science": [{"t": "الدروس — التفاعلات الكيميائية وآثارها البيئية", "b": "الدروس: أنواع التفاعلات الكيميائية، تفاعلات الاحتراق والتلوث البيئي، التدخين ومخاطره."}, {"t": "الاتحاد المباشر — التفاعلات الكيميائية وآثارها البيئية", "b": "الاتحاد المباشر: اتحاد عنصرين أو أكثر لتكوين مركب، مثل احتراق الماغنسيوم:\n2Mg + O₂ → 2MgO"}, {"t": "الانحلال الحراري — التفاعلات الكيميائية وآثارها البيئية", "b": "الانحلال الحراري: تفكك مركب بالحرارة، مثل:\nCaCO₃ → CaO + CO₂"}, {"t": "الإحلال البسيط — التفاعلات الكيميائية وآثارها البيئية", "b": "الإحلال البسيط: يحل عنصر نشط محل عنصر أقل نشاطًا، مثل:\nZn + 2HCl → ZnCl₂ + H₂"}, {"t": "ترتيب بعض الفلزات حسب النشاط — التفاعلات الكيميائية وآثارها البيئية", "b": "ترتيب بعض الفلزات حسب النشاط: Na > Mg > Al > Zn > Fe > H > Cu > Ag، والنحاس لا يتفاعل مع حمض الهيدروكلوريك المخفف."}, {"t": "الإحلال المزدوج — التفاعلات الكيميائية وآثارها البيئية", "b": "الإحلال المزدوج: تبادل أيونات مركبين، ومنه التعادل (حمض + قلوي ← ملح + ماء) والترسيب، مثل:\nNaCl + AgNO₃ → AgCl + NaNO₃ (راسب أبيض من كلوريد الفضة)"}, {"t": "دليل اليونيفرسال — التفاعلات الكيميائية وآثارها البيئية", "b": "دليل اليونيفرسال: أحمر مع الحمض القوي، أخضر عند التعادل، بنفسجي مع القلوي القوي."}, {"t": "الأكسدة — التفاعلات الكيميائية وآثارها البيئية", "b": "الأكسدة: فقد إلكترونات، والاختزال: اكتساب إلكترونات. العامل المختزل يتأكسد، والعامل المؤكسد يُختزل."}, {"t": "مثلث الاحتراق — التفاعلات الكيميائية وآثارها البيئية", "b": "مثلث الاحتراق: وقود + أكسجين + طاقة حرارية."}, {"t": "التفاعلات الكيميائية وآثارها البيئية", "b": "الاحتراق التام لهب أزرق وينتج CO₂ وبخار ماء، وغير التام لهب أصفر أو برتقالي وينتج أول أكسيد الكربون والسناج.\nCH₄ + 2O₂ → CO₂ + 2H₂O"}, {"t": "التدخين — التفاعلات الكيميائية وآثارها البيئية", "b": "التدخين: النيكوتين يسبب الإدمان، وأول أكسيد الكربون يقلل قدرة الدم على نقل الأكسجين، والقطران يسبب النفاخ الرئوي. التدخين السلبي: استنشاق غير المدخن لدخان المدخنين."}, {"t": "الدروس — الكهربية والمغناطيسية", "b": "الدروس: التيار الكهربي، الدوائر الكهربية، القوى الكهربية والمغناطيسية."}, {"t": "شدة التيار = كمية الشحنة ÷ الزمن — الكهربية والمغناطيسية", "b": "شدة التيار = كمية الشحنة ÷ الزمن:"}, {"t": "I = Q / t (الوحدة — الكهربية والمغناطيسية", "b": "I = Q / t (الوحدة: أمبير)"}, {"t": "فرق الجهد = الشغل ÷ الشحنة — الكهربية والمغناطيسية", "b": "فرق الجهد = الشغل ÷ الشحنة:"}, {"t": "V = W / Q (الوحدة — الكهربية والمغناطيسية", "b": "V = W / Q (الوحدة: فولت = جول / كولوم)"}, {"t": "قانون أوم — الكهربية والمغناطيسية", "b": "قانون أوم:\nV = I × R (المقاومة بالأوم Ω)"}, {"t": "الكهربية والمغناطيسية", "b": "الأميتر يوصل على التوالي، والفولتميتر على التوازي."}, {"t": "الكهربية والمغناطيسية", "b": "تزداد مقاومة السلك بزيادة طوله، وتقل بزيادة مساحة مقطعه، وتعتمد على نوع مادته."}, {"t": "التوصيل على التوالي — الكهربية والمغناطيسية", "b": "التوصيل على التوالي: التيار ثابت والمقاومة الكلية:\nR = R₁ + R₂ + R₃"}, {"t": "التوصيل على التوازي — الكهربية والمغناطيسية", "b": "التوصيل على التوازي: فرق الجهد ثابت، ولعدد n من المقاومات المتماثلة:\nR = r / n"}, {"t": "القدرة الكهربية — الكهربية والمغناطيسية", "b": "القدرة الكهربية:"}, {"t": "P = W / t = V × I (الوحدة — الكهربية والمغناطيسية", "b": "P = W / t = V × I (الوحدة: وات)"}, {"t": "الكهربية والمغناطيسية", "b": "الطاقة المستهلكة بالكيلووات ساعة = القدرة بالكيلووات × الزمن بالساعات."}, {"t": "الكهربية والمغناطيسية", "b": "مصابيح الليد LED أقل استهلاكًا للطاقة من مصابيح الفلورسنت المدمجة CFL."}, {"t": "الكهربية والمغ     if(c==='^'&&out.length&&i+1<s.length){i++;let t='';if(s[i]==='('){let d=0;i++;while(i<s.length&&!(s[i]===')'&&d===0)){if(s[i]==='(')d++;if(s[i]===')')d--;t+=s[i++]}i++}else t=s[i++];const p=out[out.length-1];p.sup=(p.sup||'')+t;continue}
    if(MSUB[c]!==undefined||MSUP[c]!==undefined){const k=MSUB[c]!==undefined?'sub':'sup',map=k==='sub'?MSUB:MSUP;let t='';while(i<s.length&&map[s[i]]!==undefined)t+=map[s[i++]];const p=out[out.length-1]||(out.push({t:'mi',v:''}),out[out.length-1]);p[k]=(p[k]||'')+t;continue}
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){let t='';while(i<s.length&&/[0-9.]/.test(s[i]))t+=s[i++];out.push({t:'mn',v:t});continue}
    if(/[A-Za-zα-ωΑ-ΩΔΩρμσ]/.test(c)&&c!=='Σ'){let t='';while(i<s.length&&(/[A-Za-zα-ωΑ-Ω]/.test(s[i])&&s[i]!=='Σ'||/[̀-ͯ]/.test(s[i])))t+=s[i++];out.push({t:'mi',v:t});continue}

function mGroup(toks){
  const stack=[{kids:[]}];
  for(const tk of toks){
    if(tk.t==='mo'&&(tk.v==='('||tk.v==='[')){stack.push({t:'grp',open:tk.v,kids:[]});continue}
    if(tk.t==='mo'&&(tk.v===')'||tk.v===']')&&stack.length>1){const g=stack.pop();g.close=tk.v;g.sub=tk.sub;g.sup=tk.sup;stack[stack.length-1].kids.push(g);continue}
    stack[stack.length-1].kids.push(tk);
  }
  while(stack.length>1){const g=stack.pop();g.close='';stack[stack.length-1].kids.push(g)}

}
function mFrac(nodes){
  nodes=nodes.map(n=>n.t==='grp'?{...n,kids:mFrac(n.kids)}:n);
  const out=[];

    const n=nodes[i];
    if(n.t==='mo'&&n.v==='√'&&nodes[i+1]){out.push({t:'sqrt',x:nodes[++i]});continue}
    if(n.t==='mo'&&n.v==='/'&&out.length&&nodes[i+1]&&!(out[out.length-1].t==='mo')){

const mEsc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function mScript(base,n){

  if(n.sup)return `<msup>${base}${sp}</msup>`;

}
function mNode(n,bare){
  switch(n.t){
    case 'mn':return mScript(`<mn>${mEsc(n.v)}</mn>`,n);
    case 'mi':{
      if(/^d[a-z]$/.test(n.v)&&!n.sub&&!n.sup)return `${bare?"":"<mspace width=\"0.17em\"></mspace>"}<mi>d</mi><mi>${n.v[1]}</mi>`;
      const normal=n.unit||MFUNCS.test(n.v)||n.v.length>1;
      const fn=MFUNCS.test(n.v)&&n.v!=='mol';
      return mScript(`<mi${normal?' mathvariant="normal"':''}>${mEsc(n.v)}</mi>`,n)+(fn?'<mspace width="0.2em"></mspace>':'');}
    case 'mo':{
      const big=n.v==='∫'||n.v==='Σ';
      const base=`<mo${big?' largeop="true"':''}>${mEsc(n.v)}</mo>`;
      if(big&&(n.sub||n.sup))return mScript(base,n);

    case 'sp':return '<mspace width="0.3em"></mspace>';
    case 'sqrt':return `<msqrt>${mWrap(n.x)}</msqrt>`;
  }

}
const mWrap=n=>`<mrow>${mNode(n,true)}</mrow>`;

/* Render text that mixes Arabic with LTR maths: lines in `backticks` or pure-maths lines become LTR formula blocks. */
function rich(text){
  const lines=String(text).replace(/\r/g,'').split('\n');let html='',list=false;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,(_,m)=>inlineMath(unesc(m))).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  for(let raw of lines){
    const l=raw.trim();
    if(!l){if(list){html+='</ul>';list=false}continue}
    const m=l.match(/^`([^`]+)`$/);
    const pureMath=!/[؀-ۿ]/.test(l)&&/[=+×÷/−\-^√∫Σ≤≥⇒]/.test(l)&&/[0-9a-zA-Zα-ωΩρ]/.test(l)&&l.length<120&&!/[A-Za-z]{4,}[,.:;]?\s+[A-Za-z]{4,}/.test(l);
    if(m||pureMath){if(list){html+='</ul>';list=false}const f=m?m[1]:l;html+=isChem(f)?`<div class="formula chem" dir="ltr">${esc(f)}</div>`:fm(f);continue}
    if(/^[-•*]\s+/.test(l)){if(!list){html+='<ul>';list=true}html+=`<li>${inline(l.replace(/^[-•*]\s+/,''))}</li>`;continue}
    if(list){html+='</ul>';list=false}
    html+=`<p>${inline(l.replace(/^#+\s*/,''))}</p>`;
  }
  if(list)html+='</ul>';return html;
}

function makeItems(list){return list.map(q=>{const perm=shuffle([...q.a.keys()]);return{q:q.q,opts:perm.map(i=>q.a[i]),c:perm.indexOf(0),e:q.e,ch:q.ch,src:q}})}
function examPool(){const S=state.setup;return BANK[S.subject].filter(q=>(S.ch===null||S.ch===undefined||q.ch===S.ch)&&plusOk(q))}
const chWord=subject=>CHAPTER_WORD[subject]||'الفصل';
function chName(subject,ch){return CHAPTERS[subject]&&ch!=null?`${chWord(subject)} ${ch+1}: ${CHAPTERS[subject][ch]}`:''}
function startExam(pool){

/* ---------- weak areas & mistakes bank (v1.0.0) ---------- */
const qKey=(s,q)=>{let h=5381;const t=s+'|'+q.q;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return s+':'+(h>>>0).toString(36)};
let QINDEX=null;
function qIndex(){if(!QINDEX){QINDEX={};for(const[s,qs] of Object.entries(BANK))qs.forEach(q=>{QINDEX[qKey(s,q)]={s,q}})}return QINDEX}
const DAY=864e5,REVIEW_GAP=[0,1,3,7]; // box -> days until next review; a correct answer at box 3 = mastered
function bankData(){const v=load('mbank',{});return v&&typeof v==='object'?v:{}}
function chData(){const v=load('chstats',{});return v&&typeof v==='object'?v:{}}
function seedFromHistory(){
  if(load('mbankSeeded',false))return;
  const bank=bankData(),cs=chData(),idx=qIndex(),h=history();
  h.slice().reverse().forEach(x=>{
    if(!BANK[x.subject])return;
    (x.mistakes||[]).forEach(t=>{const q=BANK[x.subject].find(q=>q.q===t);if(!q)return;const k=qKey(x.subject,q);bank[k]={s:x.subject,box:0,due:Date.parse(x.date)||Date.now(),w:((bank[k]||{}).w||0)+1}});
    if(x.ch!=null&&x.total){const c=(cs[x.subject]=cs[x.subject]||{});const e=(c[x.ch]=c[x.ch]||{n:0,c:0});e.n+=x.total;e.c+=x.correct||0}
  });
  save('mbank',bank);save('chstats',cs);save('mbankSeeded',true);
}
/* called once per finished exam */
function trackResult(subject,rows){
  const bank=bankData(),cs=chData(),now=Date.now();let added=0;
  rows.forEach(r=>{
    const q=r.src;if(!q)return;const ok=r.status==='ok';
    if(q.ch!=null){const c=(cs[subject]=cs[subject]||{});const e=(c[q.ch]=c[q.ch]||{n:0,c:0});e.n++;if(ok)e.c++}
    const k=qKey(subject,q),b=bank[k];
    if(!ok){if(!b||b.box>=4)added++;bank[k]={s:subject,box:0,due:now,w:((b||{}).w||0)+1,last:now}}
    else if(b&&b.box<4&&b.due<=now){b.box++;b.last=now;if(b.box>=4)b.done=now;else b.due=now+REVIEW_GAP[b.box]*DAY}
  });
  save('mbank',bank);save('chstats',cs);return added;
}
function bankItems(subject){const idx=qIndex();return Object.entries(bankData()).filter(([k,b])=>idx[k]&&(!subject||b.s===subject)).map(([k,b])=>({k,...b,q:idx[k].q}))}
function dueItems(subject){const now=Date.now();return bankItems(subject).filter(x=>x.box<4&&x.due<=now)}
function chLevel(acc){return acc<50?['ضعيف','bad']:acc<75?['متوسط','warn']:['جيد','good']}
function weakRows(){
  const cs=chData(),out=[];
  branchSubjects().forEach(s=>{if(!CHAPTERS[s])return;Object.entries(cs[s]||{}).forEach(([ch,e])=>{ch=+ch;if(e.n>=3&&CHAPTERS[s][ch]!==undefined)out.push({s,ch,n:e.n,acc:Math.round(e.c/e.n*100)})})});
  return out.sort((a,b)=>a.acc-b.acc||b.n-a.n);
}
function practiceChapter(s,ch){if(ch>0&&!plusGate())return;state.setup={...state.setup,subject:s,ch,mode:'normal',count:10};go('exams')}
function reviewBank(s,ch){

}

const figHtml=q=>q&&q.fig&&FIGS[q.fig]?`<div class="qfig">${FIGS[q.fig]}</div>`:'';
function lessonsHtml(id){
  const ls=LESSONS[id];if(!ls||!CHAPTERS[id])return '';
  const items=ls.map((b,k)=>b?`<details class="card lesson-u"><summary class="row"><b>${k>0&&!isPlus()?'🔒 ':''}${chWord(id)} ${k+1}: ${esc(CHAPTERS[id][k])}</b><span class="pill">اشرح</span></summary><div class="lesson-body"${id==='english'?' dir="ltr"':''}>${k>0&&!isPlus()?`<div class="plus-lock"><p class="muted">شرح هذه ال${chWord(id).replace(/^ال/,'')} ضمن تفوق بلس. الوحدة الأولى مجانية.</p><button type="button" class="btn" onclick="paywall()">👑 تفوق بلس</button></div>`:rich(b)}</div><div class="btns"><button type="button" class="btn soft" onclick="practiceChapter('${id}',${k})">امتحن في هذه ${id==='chemistry'?'الباب':id==='biology'||id==='history'||id==='physics'?'الفصل':'الوحدة'}</button>${ESSAYS[id]&&ESSAYS[id].some(e=>e.ch===k)?`<button type="button" class="btn ghost" onclick="openEssays('${id}',${k})">أسئلة مقالية</button>`:''}</div></details>`:'').join('');
  return items?`<h2>شرح ال${chPlural(id)}</h2>${items}`:'';
}
let essay={subject:null,ch:null,idx:0,shown:false};
function essayList(){const s=essay.subject;return (ESSAYS[s]||[]).filter(e=>essay.ch==null||e.ch===essay.ch)}
function openEssays(s,ch){if(!isPlus()&&ch!==0){if(ch==null)ch=0;else{paywall();return}}essay={subject:s,ch:ch??null,idx:0,shown:false};go('essay')}
function essayKey(s,e){return qKey(s,{q:e.q})}
function setEssayMark(m){const list=essayList(),e=list[essay.idx];const k=essayKey(essay.subject,e);const all=load('essayMarks',{});all[k]=m;save('essayMarks',all);if(essay.idx<list.length-1){essay.idx++;essay.shown=false}render();window.scrollTo(0,0)}
function saveEssayDraft(v){const list=essayList(),e=list[essay.idx];const d=load('essayDrafts',{});d[essayKey(essay.subject,e)]=v;save('essayDrafts',d)}

  const subs=branchSubjects().filter(s=>(ESSAYS[s]||[]).length);

    <div class="card"><span class="label">المادة</span><div class="choices">${subs.map(id=>`<button type="button" class="choice" aria-pressed="${id===s}" onclick="essay={subject:'${id}',ch:null,idx:0,shown:false};render()">${esc(SUBJECTS[id].name)}</button>`).join('')}</div>
    ${CHAPTERS[s]?`<span class="label">${chWord(s)}</span><div class="choices"><button type="button" class="choice" aria-pressed="${essay.ch===null}" onclick="essay.ch=null;essay.idx=0;essay.shown=false;render()">الكل</button>${chs.map(c=>`<button type="button" class="choice" aria-pressed="${essay.ch===c}" onclick="essay.ch=${c};essay.idx=0;essay.shown=false;render()">${c+1}</button>`).join('')}</div>`:''}</div>
    <div class="stats"><div class="stat"><b>${list.length}</b>سؤالاً</div><div class="stat"><b>${done}</b>قيّمت إجابتها</div><div class="stat"><b>${ok}</b>إجابة كاملة</div></div>
    ${e?`<div class="card">
      <div class="row"><span class="pill">سؤال ${essay.idx+1} من ${list.length}</span>${m?`<span class="pill ${m==='ok'?'good':m==='part'?'warn':'bad'}">${{ok:'كاملة',part:'ناقصة',no:'خاطئة'}[m]}</span>`:''}</div>
      ${CHAPTERS[s]?`<div class="muted">${esc(chName(s,e.ch))}</div>`:''}
      <div class="qtext"${s==='english'?' dir="ltr"':''}>${rich(e.q)}</div>
      <label class="label" for="essay-ans">إجابتك</label>
      <textarea id="essay-ans" class="essay-box"${s==='english'?' dir="ltr"':''} rows="5" placeholder="اكتب إجابتك هنا ثم قارنها بالإجابة النموذجية" oninput="saveEssayDraft(this.value)">${esc(drafts[k]||'')}</textarea>
      ${essay.shown?`<div class="model"><b>الإجابة النموذجية</b><div${s==='english'?' dir="ltr"':''}>${rich(e.a)}</div></div>
        <span class="label">قيّم إجابتك بأمانة</span>
        <div class="btns"><button type="button" class="btn" onclick="setEssayMark('ok')">كاملة</button><button type="button" class="btn soft" onclick="setEssayMark('part')">ناقصة</button><button type="button" class="btn ghost" onclick="setEssayMark('no')">خاطئة</button></div>`
      :`<button type="button" class="btn block" onclick="essay.shown=true;render()">اعرض الإجابة النموذجية</button>`}
      <div class="btns" style="justify-content:space-between"><button type="button" class="btn ghost" ${essay.idx===0?'disabled':''} onclick="essay.idx--;essay.shown=false;render()">→ السابق</button><button type="button" class="btn ghost" ${essay.idx>=list.length-1?'disabled':''} onclick="essay.idx++;essay.shown=false;render()">التالي ←</button></div>
      <button type="button" class="link" onclick="askTutorAbout('${s}',${JSON.stringify('اشرح لي إجابة هذا السؤال المقالي: '+(e.q||'')).replace(/"/g,'&quot;')},null)">اسأل المدرس الذكي عن هذا السؤال</button>
    </div>`:'<p class="empty">لا توجد أسئلة مقالية هنا بعد.</p>'}
    <p class="note">في امتحان الوزارة أسئلة مقالية إلى جانب الاختيار من متعدد. اكتب إجابتك كاملة قبل أن تنظر إلى الإجابة النموذجية.</p>
  </div>`;
}

function sessionRow(s){const done=isDone(s);const name=s.subject==='review'?'مراجعة عامة':SUBJECTS[s.subject]?.name||'';return `<div class="session ${done?'done':''}"><button type="button" class="check" aria-pressed="${done}" aria-label="تم" onclick="toggleSession('${s.id}')">✓</button><span class="time">${esc(s.time)}</span><span class="what"><b>${esc(name)}</b><div class="muted">${s.minutes} دقيقة${s.note?' • '+esc(s.note):''}</div></span>${state.screen==='plan'?`<button type="button" class="icon-btn" aria-label="حذف" onclick="deleteSession('${s.id}')">×</button>`:''}</div>`}
function toggleSession(id){const all=load('sessions',[]);const s=all.find(x=>x.id===id);if(!s)return;const w=weekKey();s.doneWeeks=s.doneWeeks||[];s.doneWeeks=s.doneWeeks.includes(w)?s.doneWeeks.filter(x=>x!==w):[...s.doneWeeks.filter(x=>x>=w).slice(-3),w];save('sessions',all);const y=window.scrollY;render();window.scrollTo(0,y)}
function deleteSession(id){save('sessions',load('sessions',[]).filter(x=>x.id!==id));render()}
function addSession(){
  const subject=document.getElementById('ps-subject').value,time=document.getElementById('ps-time').value||'17:00',minutes=+document.getElementById('ps-min').value,note=document.getElementById('ps-note').value.trim().slice(0,60);
  const all=load('sessions',[]);all.push({id:uid(),day:state.planDay,subject,time,minutes,note,doneWeeks:[]});save('sessions',all);toast('أُضيفت الجلسة');render();
}
function suggestPlan(){
  const go2=()=>{const subs=branchSubjects(),out=[];let k=0;for(let d=0;d<6;d++){for(const t of ['16:00','18:30']){out.push({id:uid(),day:d,subject:subs[k%subs.length],time:t,minutes:90,note:'',doneWeeks:[]});k++}}out.push({id:uid(),day:6,subject:'review',time:'17:00',minutes:120,note:'حل امتحان بابل شيت كامل',doneWeeks:[]});save('sessions',out);toast('تم إنشاء جدول أسبوعي مقترح');render()};
  if(load('sessions',[]).length)modal({title:'استبدال الجدول الحالي؟',body:'سيُستبدل جدولك بجدول مقترح: جلستان يومياً لمواد شعبتك، ويوم الجمعة للمراجعة.',ok:'استبدل',onOk:go2});else go2();
}

function addTask(){const el=document.getElementById('task-input'),s=el.value.trim();if(!s)return;const t=load('tasks',[]);t.push({text:s,done:false});save('tasks',t);render();document.getElementById('task-input').focus()}

function deleteTask(i){const t=load('tasks',[]);t.splice(i,1);save('tasks',t);render()}

    if(!LOCKS_ON)return '';
    if(isPlus())return `<div class="card plus-card"><div class="row"><b>👑 تفوق بلس ${PLUS_YEAR}</b><span class="pill good">مفعّل</span></div><div class="muted">صالح حتى 31 أغسطس 2027</div></div>`;
    return `<button type="button" class="card plus-card plus-cta" onclick="paywall()"><span class="plus-k">TAFAWOQ PLUS</span><b>👑 افتح كل الوحدات مع تفوق بلس ${PLUS_YEAR}</b><span class="muted">المجاني: الوحدة الأولى من كل مادة. بلس: كل الوحدات، البابل شيت، والمدرس الذكي.</span></button>`;
  }
  function lockedTutor(){
    appEl.innerHTML=bar('المدرس الذكي')+`<div class="screen wrap"><div class="card plus-lock"><div style="font-size:34px">🔒</div><h3>المدرس الذكي ضمن تفوق بلس</h3><p class="muted">اسأل عن أي درس، أو اكتب مسألة بالأرقام وسيحلها معك خطوة بخطوة.</p><button type="button" class="btn block" onclick="paywall()">👑 اعرف المزيد عن تفوق بلس</button></div></div>`;
  }
  function paywall(){
    const root=document.getElementById('modal-root');
    const feats=[['📚','كل وحدات كل المواد','بنوك الأسئلة كاملة لكل الوحدات'],['📝','محاكاة البابل شيت','كراسة أسئلة وورقة إجابة كالامتحان الحقيقي'],['🤖','المدرس الذكي','شرح الدروس وحل المسائل خطوة بخطوة']];
    const terms=['دفعة واحدة، بدون تجديد تلقائي','الوصول حتى 31 أغسطس 2027','استعادة الشراء على الأجهزة المرتبطة بالحساب','تحديثات المحتوى خلال فترة الصلاحية'];
    let h=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="p-title"><div class="card plus-sheet">
      <div class="plus-k">TAFAWOQ PLUS</div><h3 id="p-title">🎓 تفوق بلس ${PLUS_YEAR}</h3>`;
    if(isPlus()) h+=`<p><span class="pill good">✓ مفعّل</span> صالح حتى 31 أغسطس 2027</p>`;
    else{
      h+=`<div class="plus-price"><b id="plus-price">${esc(billing.price||'299')}</b> <span>${billing.price?'':'جنيه مصري '}/ العام الدراسي</span></div>`;
      if(plusOwned()&&plusExpired())h+=`<p class="note">انتهت صلاحية تفوق بلس 2026–2027.</p>`;
    }
    h+=`<ul class="plus-list">${feats.map(f=>`<li><span>${f[0]}</span><div><b>${f[1]}</b><small>${f[2]}</small></div></li>`).join('')}</ul>
      <ul class="plus-terms">${terms.map(t=>`<li>✓ ${t}</li>`).join('')}</ul>`;
    if(isPlus()) h+=`<button type="button" class="btn block" id="p-close">تم</button>`;
    else if(billing.service) h+=`<div class="btns" style="flex-direction:column"><button type="button" class="btn block" id="p-buy">اشترك في تفوق بلس</button><button type="button" class="btn ghost block" id="p-restore">استعادة الشراء</button><button type="button" class="btn ghost block" id="p-close">ليس الآن</button></div>`;
    else h+=`<p class="muted">📱 الشراء متاح من تطبيق «تفوق إعدادي» على Google Play.</p><div class="btns" style="flex-direction:column"><a class="btn block" style="text-decoration:none" href="https://play.google.com/store/apps/details?id=${PLAY_ID}" target="_blank" rel="noopener">Google Play</a><button type="button" class="btn ghost block" id="p-close">ليس الآن</button></div>`;
    root.innerHTML=h+`</div></div>`;
    const close=()=>root.innerHTML='';
    root.querySelector('#p-close').onclick=close;
    root.querySelector('.modal').onclick=e=>{if(e.target.classList.contains('modal'))close()};
    const b=root.querySelector('#p-buy');if(b)b.onclick=buyPlus;
    const r=root.querySelector('#p-restore');if(r)r.onclick=()=>restorePlus(true);
  }
  function verifyPurchase(token){
    return fetch(VERIFY_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:VERIFY_KEY,Authorization:'Bearer '+VERIFY_KEY},body:JSON.stringify({purchaseToken:token,sku:PLUS_SKU})})
      .then(r=>r.json().then(d=>{if(!r.ok&&r.status>=500)throw new Error('server');return !!(d&&d.valid)}));
  }
  function initBilling(){
    if(!('getDigitalGoodsService' in window))return;
    window.getDigitalGoodsService('https://play.google.com/billing').then(service=>{
      billing.service=service;
      service.getDetails([PLUS_SKU]).then(items=>{const it=items&&items[0];
        if(it&&it.price){try{billing.price=new Intl.NumberFormat('ar-EG',{style:'currency',currency:it.price.currency}).format(it.price.value)}catch(e){billing.price=it.price.value+' '+it.price.currency}}
        const p=document.getElementById('plus-price');if(p)p.textContent=billing.price;}).catch(()=>{});
      restorePlus(false);
    }).catch(()=>{billing.service=null});
  }
  function restorePlus(manual){
    if(!billing.service){if(manual)toast('الشراء متاح من تطبيق «تفوق إعدادي» على Google Play');return}
    billing.service.listPurchases().then(list=>{
      const p=(list||[]).find(x=>x.itemId===PLUS_SKU);
      if(!p){setPlus(false);if(manual)toast('لا يوجد شراء سابق على هذا الحساب');return}
      return verifyPurchase(p.purchaseToken).then(ok=>{setPlus(ok);if(manual){toast(ok?'تم تفعيل تفوق بلس':'تعذّر التحقق من الشراء');if(ok)document.getElementById('modal-root').innerHTML=''}})
        .catch(()=>setPlus(true)); // server not reachable: trust Google Play's list, check again next launch
    }).catch(()=>{if(manual)toast('تعذّر التحقق من الشراء')});
  }
  function buyPlus(){
    if(!billing.service||billing.busy)return;
    if(!window.PaymentRequest){toast('لم يكتمل الشراء. حاول مرة أخرى');return}
    billing.busy=true;let req;
    try{req=new PaymentRequest([{supportedMethods:'https://play.google.com/billing',data:{sku:PLUS_SKU}}],{total:{label:'Total',amount:{currency:'EGP',value:'0'}}})}
    catch(e){billing.busy=false;toast('لم يكتمل الشراء. حاول مرة أخرى');return}
    req.show().then(res=>{const token=res.details&&res.details.purchaseToken;
      return verifyPurchase(token).then(ok=>res.complete(ok?'success':'fail').then(()=>{billing.busy=false;if(ok){document.getElementById('modal-root').innerHTML='';setPlus(true);toast('شكراً! تم تفعيل تفوق بلس')}else toast('لم يكتمل الشراء. حاول مرة أخرى')}))
        .catch(()=>res.complete('fail').then(()=>{billing.busy=false;toast('لم يكتمل الشراء. حاول مرة أخرى')}));
    }).catch(()=>{billing.busy=false}); // cancelled
  }

render();
initBilling();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script>
</body>
</html>
